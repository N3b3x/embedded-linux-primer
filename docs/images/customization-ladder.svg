<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="The customization ladder, from the cheapest change to the most dangerous: application and service, root filesystem, device tree, kernel config, kernel patch, bootloader environment, bootloader patch or config, secure firmware, and finally the boot ROM and security fuses. For each rung the example, the folder it lives in, the rebuild time, what happens when it goes wrong and the way back."><rect x="0" y="0" width="1400" height="900" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">Where does my change go? The customization ladder</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Start at the top rung that can do the job. Each step up costs a longer rebuild and a worse failure when you get it wrong.</text><text x="300" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="800" text-anchor="start" style="fill:#64748b;white-space:pre" letter-spacing="1.2">EXAMPLE</text><text x="560" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="800" text-anchor="start" style="fill:#64748b;white-space:pre" letter-spacing="1.2">WHERE IT LIVES</text><text x="850" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="800" text-anchor="start" style="fill:#64748b;white-space:pre" letter-spacing="1.2">REBUILD</text><text x="990" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="800" text-anchor="start" style="fill:#64748b;white-space:pre" letter-spacing="1.2">WHEN IT GOES WRONG</text><text x="1200" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="800" text-anchor="start" style="fill:#64748b;white-space:pre" letter-spacing="1.2">WAY BACK</text><rect x="32" y="124" width="1336" height="70" rx="12" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><rect x="32" y="124" width="250" height="70" rx="12" fill="#0d9488"/><circle cx="58" cy="159" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="163.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">1</text><text x="82" y="165" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Application / service</text><text x="300" y="165" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">run my program at boot</text><text x="560" y="165" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">scripts/rootfs/ hook</text><text x="850" y="165" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">seconds</text><text x="990" y="165" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">service fails</text><text x="1200" y="165" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">edit and reboot</text><rect x="32" y="202" width="1336" height="70" rx="12" fill="#1d1640" stroke="#8b5cf6" stroke-width="1.3"/><rect x="32" y="202" width="250" height="70" rx="12" fill="#7c3aed"/><circle cx="58" cy="237" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="241.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">2</text><text x="82" y="243" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Root filesystem</text><text x="300" y="243" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">add a package, a user, a config file</text><text x="560" y="243" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#c4b5fd;white-space:pre">scripts/rootfs/ · packages</text><text x="850" y="243" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">a minute</text><text x="990" y="243" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">no login</text><text x="1200" y="243" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">re-flash the rootfs</text><rect x="32" y="280" width="1336" height="70" rx="12" fill="#1d1640" stroke="#8b5cf6" stroke-width="1.3"/><rect x="32" y="280" width="250" height="70" rx="12" fill="#7c3aed"/><circle cx="58" cy="315" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="319.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">3</text><text x="82" y="321" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Device tree</text><text x="300" y="321" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">enable a UART or I²C sensor</text><text x="560" y="321" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#c4b5fd;white-space:pre">custom/dts/</text><text x="850" y="321" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">seconds</text><text x="990" y="321" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">device missing or early hang</text><text x="1200" y="321" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">boot the old .dtb</text><rect x="32" y="358" width="1336" height="70" rx="12" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><rect x="32" y="358" width="250" height="70" rx="12" fill="#0d9488"/><circle cx="58" cy="393" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="397.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">4</text><text x="82" y="399" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Kernel config</text><text x="300" y="399" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">enable a driver, a filesystem, a feature</text><text x="560" y="399" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">config/kernel/*.cfg</text><text x="850" y="399" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">minutes (ccache)</text><text x="990" y="399" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">no boot or missing device</text><text x="1200" y="399" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">re-flash /boot</text><rect x="32" y="436" width="1336" height="70" rx="12" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><rect x="32" y="436" width="250" height="70" rx="12" fill="#0d9488"/><circle cx="58" cy="471" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="475.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">5</text><text x="82" y="477" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Kernel patch</text><text x="300" y="477" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">fix or add driver code</text><text x="560" y="477" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">patches/kernel/</text><text x="850" y="477" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">minutes</text><text x="990" y="477" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">oops or no boot</text><text x="1200" y="477" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">re-flash /boot</text><rect x="32" y="514" width="1336" height="70" rx="12" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.3"/><rect x="32" y="514" width="250" height="70" rx="12" fill="#2563eb"/><circle cx="58" cy="549" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="553.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">6</text><text x="82" y="555" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Bootloader environment</text><text x="300" y="555" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">boot order, console, kernel args</text><text x="560" y="555" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">uEnv.txt · extlinux.conf · env</text><text x="850" y="555" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">seconds</text><text x="990" y="555" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">no kernel found</text><text x="1200" y="555" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">fix it at the prompt</text><rect x="32" y="592" width="1336" height="70" rx="12" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.3"/><rect x="32" y="592" width="250" height="70" rx="12" fill="#2563eb"/><circle cx="58" cy="627" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="631.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">7</text><text x="82" y="633" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Bootloader patch / config</text><text x="300" y="633" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">new boot source, new board variant</text><text x="560" y="633" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">patches/uboot/ · defconfig</text><text x="850" y="633" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">minutes</text><text x="990" y="633" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#fda4af;white-space:pre">board stops at the ROM</text><text x="1200" y="633" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">boot another medium</text><rect x="32" y="670" width="1336" height="70" rx="12" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.3"/><rect x="32" y="670" width="250" height="70" rx="12" fill="#e11d48"/><circle cx="58" cy="705" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="709.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">8</text><text x="82" y="711" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Secure firmware</text><text x="300" y="711" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">TF-A, OP-TEE, DDR, secure services</text><text x="560" y="711" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#fda4af;white-space:pre">patches/atf/ · optee</text><text x="850" y="711" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">minutes</text><text x="990" y="711" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#fda4af;white-space:pre">no serial output at all</text><text x="1200" y="711" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">other medium or USB boot</text><rect x="32" y="748" width="1336" height="70" rx="12" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><rect x="32" y="748" width="250" height="70" rx="12" fill="#475569"/><circle cx="58" cy="783" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/><text x="58" y="787.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">9</text><text x="82" y="789" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Boot ROM, fuses</text><text x="300" y="789" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">lock to signed images only</text><text x="560" y="789" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">vendor tools; NOT in this repo</text><text x="850" y="789" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">n/a</text><text x="990" y="789" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#fda4af;white-space:pre">a bricked board, forever</text><text x="1200" y="789" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">none: one-time fuses</text><text x="32" y="840" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Rung 1 is the cheapest to try, rung 9 cannot be undone. Rule of thumb: use the lowest-numbered rung that can do the job.</text><text x="32" y="860" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Every board directory has the same folders for these rungs (see docs/board-contract.md), so the answer to 'where does this go?' is the same on every board.</text></svg>
