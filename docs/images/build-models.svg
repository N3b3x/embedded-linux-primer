<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-label="Two ways software reaches a board. SD-card image model: build the pieces, assemble one disk image, write it to an SD card, set the boot switch, power on. Vendor-flash model: download the vendor's board support package, add your kernel and rootfs into its staging tree, put the board into USB recovery mode, flash with the vendor tool, reboot."><rect x="0" y="0" width="1400" height="830" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker><marker id="m-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/></marker><marker id="m-f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">Two ways software reaches a board</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Which one you get is decided by the silicon vendor's boot ROM and tooling, not by you. Everything else in the stack is the same.</text><rect x="32" y="100" width="668" height="632" rx="16" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.8"/><rect x="32" y="100" width="668" height="64" rx="16" fill="#2563eb"/><rect x="32" y="140" width="668" height="24" rx="0" fill="#2563eb"/><g transform="translate(52,118) scale(1.16667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01" /> <path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /> <path d="M21.946 12.013H2.054" /> <path d="M6 16h.01" /></g><text x="92" y="128" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="18" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">SD-card image model</text><text x="92" y="150" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e2e8f0;white-space:pre">i.MX 8M Plus  ·  STM32MP257F-DK</text><rect x="52" y="184" width="628" height="70" rx="12" fill="#121c33" stroke="#f59e0b" stroke-width="1.4"/><circle cx="78" cy="219" r="12" fill="#d97706" stroke="#0b1220" stroke-width="2"/><text x="78" y="223.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">1</text><text x="104" y="212" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#fcd34d;white-space:pre">Build the pieces</text><text x="104" y="234" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">boot firmware, U-Boot, kernel, rootfs: each into build/deploy/</text><text x="666" y="212" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">./build.sh all</text><line x1="366" y1="256" x2="366" y2="280" stroke="#e5edf7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="52" y="284" width="628" height="70" rx="12" fill="#121c33" stroke="#f59e0b" stroke-width="1.4"/><circle cx="78" cy="319" r="12" fill="#d97706" stroke="#0b1220" stroke-width="2"/><text x="78" y="323.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">2</text><text x="104" y="312" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#fcd34d;white-space:pre">Assemble ONE disk image</text><text x="104" y="334" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">bootloader at a fixed offset or partition, then the rootfs</text><text x="666" y="312" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">image.sh</text><line x1="366" y1="356" x2="366" y2="380" stroke="#e5edf7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="52" y="384" width="628" height="70" rx="12" fill="#121c33" stroke="#8b5cf6" stroke-width="1.4"/><circle cx="78" cy="419" r="12" fill="#7c3aed" stroke="#0b1220" stroke-width="2"/><text x="78" y="423.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">3</text><text x="104" y="412" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#c4b5fd;white-space:pre">Write the image to an SD card</text><text x="104" y="434" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">the PC only needs a card reader; no vendor tool</text><text x="666" y="412" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">./build.sh flash</text><line x1="366" y1="456" x2="366" y2="480" stroke="#e5edf7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="52" y="484" width="628" height="70" rx="12" fill="#121c33" stroke="#64748b" stroke-width="1.4"/><circle cx="78" cy="519" r="12" fill="#475569" stroke="#0b1220" stroke-width="2"/><text x="78" y="523.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">4</text><text x="104" y="512" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#cbd5e1;white-space:pre">Move the card, set the boot switch</text><text x="104" y="534" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">the Boot ROM reads the card by itself</text><text x="666" y="512" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">switch → SD</text><line x1="366" y1="556" x2="366" y2="580" stroke="#e5edf7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="52" y="584" width="628" height="70" rx="12" fill="#121c33" stroke="#14b8a6" stroke-width="1.4"/><circle cx="78" cy="619" r="12" fill="#0d9488" stroke="#0b1220" stroke-width="2"/><text x="78" y="623.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">5</text><text x="104" y="612" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#5eead4;white-space:pre">Power on</text><text x="104" y="634" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">ROM → firmware → U-Boot → Linux, all from the card</text><text x="666" y="612" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">serial 115200</text><rect x="52" y="684" width="628" height="38" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="66" y="708" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#5eead4;white-space:pre">Fix a mistake: re-flash the card. The ROM runs first, so a bad card cannot brick it.</text><rect x="700" y="100" width="668" height="632" rx="16" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.8"/><rect x="700" y="100" width="668" height="64" rx="16" fill="#e11d48"/><rect x="700" y="140" width="668" height="24" rx="0" fill="#e11d48"/><g transform="translate(720,118) scale(1.16667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="1" /> <circle cx="4" cy="20" r="1" /> <path d="M4.7 19.3 19 5" /> <path d="m21 3-3 1 2 2Z" /> <path d="M9.26 7.68 5 12l2 5" /> <path d="m10 14 5 2 3.5-3.5" /> <path d="m18 12 1-1 1 1-1 1Z" /></g><text x="760" y="128" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="18" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Vendor-flash model</text><text x="760" y="150" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e2e8f0;white-space:pre">Jetson Orin Nano  (also: many QSPI/eMMC-only SoCs)</text><rect x="720" y="184" width="628" height="70" rx="12" fill="#121c33" stroke="#f59e0b" stroke-width="1.4"/><circle cx="746" cy="219" r="12" fill="#d97706" stroke="#0b1220" stroke-width="2"/><text x="746" y="223.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">1</text><text x="772" y="212" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#fcd34d;white-space:pre">Download the vendor's board support package</text><text x="772" y="234" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">signed boot firmware + flashing tools + sample rootfs</text><text x="1334" y="212" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">./build.sh fetch</text><line x1="1034" y1="256" x2="1034" y2="280" stroke="#e5edf7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="720" y="284" width="628" height="70" rx="12" fill="#121c33" stroke="#8b5cf6" stroke-width="1.4"/><circle cx="746" cy="319" r="12" fill="#7c3aed" stroke="#0b1220" stroke-width="2"/><text x="746" y="323.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">2</text><text x="772" y="312" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#c4b5fd;white-space:pre">Add your parts into its staging tree</text><text x="772" y="334" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">your kernel, device tree, rootfs changes</text><text x="1334" y="312" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">kernel · rootfs</text><line x1="1034" y1="356" x2="1034" y2="380" stroke="#e5edf7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="720" y="384" width="628" height="70" rx="12" fill="#121c33" stroke="#64748b" stroke-width="1.4"/><circle cx="746" cy="419" r="12" fill="#475569" stroke="#0b1220" stroke-width="2"/><text x="746" y="423.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">3</text><text x="772" y="412" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#cbd5e1;white-space:pre">Put the board in recovery mode</text><text x="772" y="434" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">jumper/button + USB cable: the Boot ROM now waits for the host</text><text x="1334" y="412" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">lsusb</text><line x1="1034" y1="456" x2="1034" y2="480" stroke="#e5edf7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="720" y="484" width="628" height="70" rx="12" fill="#121c33" stroke="#f43f5e" stroke-width="1.4"/><circle cx="746" cy="519" r="12" fill="#e11d48" stroke="#0b1220" stroke-width="2"/><text x="746" y="523.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">4</text><text x="772" y="512" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#fda4af;white-space:pre">The vendor tool flashes it over USB</text><text x="772" y="534" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">boot firmware into on-board flash, OS into SD/NVMe/eMMC</text><text x="1334" y="512" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">./build.sh flash</text><line x1="1034" y1="556" x2="1034" y2="580" stroke="#e5edf7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="720" y="584" width="628" height="70" rx="12" fill="#121c33" stroke="#14b8a6" stroke-width="1.4"/><circle cx="746" cy="619" r="12" fill="#0d9488" stroke="#0b1220" stroke-width="2"/><text x="746" y="623.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">5</text><text x="772" y="612" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#5eead4;white-space:pre">Reboot</text><text x="772" y="634" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">firmware now lives in the board's own flash, not on a card</text><text x="1334" y="612" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e5edf7;white-space:pre">serial 115200</text><rect x="720" y="684" width="628" height="38" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="734" y="708" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#fda4af;white-space:pre">Fix a mistake: flash again. Recovery mode lives in the ROM (until you burn fuses).</text><text x="32" y="774" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Why it matters: the SD-card model lets you iterate with one cheap card and see the whole build as one image. The vendor-flash model needs a Linux x86-64 host</text><text x="32" y="794" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">and the vendor's tools, but the boot firmware sits in on-board flash, so it can be signed and updated as a unit, separately from the OS storage.</text></svg>
