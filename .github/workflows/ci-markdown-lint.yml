# Markdown lint through the shared workflow in N3b3x/hf-general-ci-tools.
name: Markdown Lint CI

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-markdown-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown Lint
    uses: N3b3x/hf-general-ci-tools/.github/workflows/ru-markdown-lint.yml@main
    with:
      globs: 'docs/**/*.md boards/**/*.md *.md'
      exclude_patterns: '.git/**,node_modules/**,venv/**,.venv/**,build/**,site-out/**,site-src/**'
      config_file: '.markdownlint.json'
      use_docker: false
      fix: false
      separator: ''
