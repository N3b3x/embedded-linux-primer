# External link check through the shared workflow in N3b3x/hf-general-ci-tools. Relative links are
# checked by tools/check-links.py in ci.yml; this one reports dead external links without failing the run.
name: Docs Link Check CI

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docs-linkcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    name: Documentation Link Check
    uses: N3b3x/hf-general-ci-tools/.github/workflows/ru-docs-linkcheck.yml@main
    with:
      paths: 'docs/** boards/** site/** *.md'
      fail_on_errors: false
      timeout: '30'
      max_retries: '3'
      retry_wait_time: '2'
      exclude_private: true
      exclude_mail: true
      verbose: true
