# YAML lint through the shared workflow in N3b3x/hf-general-ci-tools.
name: YAML Lint CI

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-yaml-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: YAML Lint
    uses: N3b3x/hf-general-ci-tools/.github/workflows/ru-yaml-lint.yml@main
    with:
      paths: '.github/workflows/*.yml,**/*.yml,**/*.yaml'
      config_file: '.yamllint'
      strict_mode: false
      exclude_patterns: '.git/**,.venv/**,build/**,site-out/**,site-src/**'
