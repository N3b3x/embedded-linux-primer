# shellcheck shell=bash
# =============================================================================
#  Board / BSP configuration for the Digilent Eclypse Z7
#  (AMD/Xilinx Zynq-7000 XC7Z020, dual Cortex-A9, 1 GiB DDR3L; see docs/12-board-tour.md)
# =============================================================================
#
#  This file is *sourced* by every script in scripts/. It only sets variables.
#
#  Every value uses the form  : "${VAR:=default}"  which means:
#     "if VAR is already set in the environment, keep it, otherwise use default"
#  So you can override anything for a single run without editing this file:
#
#     KERNEL_VERSION=6.18.59 KERNEL_SHA256=<sum> ./build.sh kernel
#
#  Or keep your overrides in config/local.conf (git-ignored), which build.sh
#  sources *before* this file.
#
#  Every source here is UPSTREAM (U-Boot and kernel.org). The one thing that is
#  not is the board's PS7 initialisation file, which comes from the hardware
#  design, not from a software project: see the PS7_INIT_* block below and
#  docs/03-uboot-spl.md.
#
#  *_REV variables pin a git commit for reproducible builds. Set one to an empty
#  string (e.g. UBOOT_REV=) to follow the tip of the ref instead.
# =============================================================================

: "${BSP_RELEASE:=upstream-2026.10}"
: "${BOARD_NAME:=eclypse-z7}"

# -----------------------------------------------------------------------------
# U-Boot: it plays TWO roles on this board
#   SPL     (spl/boot.bin -> BOOT.BIN) the first-stage loader the BootROM runs from
#           on-chip RAM. It takes over the job of Xilinx's "FSBL": it runs the PS7
#           initialisation (DDR, clocks, MIO pins) and then loads U-Boot proper.
#   proper  (u-boot.img) the full bootloader with the shell, which reads
#           extlinux.conf and starts Linux.
# One source tree, one defconfig, two binaries.
# -----------------------------------------------------------------------------
: "${UBOOT_REPO:=https://github.com/u-boot/u-boot.git}"
: "${UBOOT_BRANCH:=v2026.07}"
: "${UBOOT_REV:=ece349ade2973e220f524ce59e59711cc919263f}"
# The generic Zynq-7000 defconfig of mainline U-Boot (SPL enabled).
: "${UBOOT_DEFCONFIG:=xilinx_zynq_virt_defconfig}"
# Board device tree: custom/dts/zynq-eclypse-z7.dts (no in-tree tree exists for this board).
: "${UBOOT_DEVICE_TREE:=zynq-eclypse-z7}"

# -----------------------------------------------------------------------------
# PS7 initialisation (ps7_init_gpl.c / .h)
#
# The Zynq PS cannot use its DDR until ~1000 register writes have configured the PLLs, the
# DDR controller, the clock dividers and the MIO pin muxes. Xilinx's tools generate
# those writes from the hardware design as "ps7_init". U-Boot has such a file for
# a few boards but not for the Eclypse Z7, so this build takes it from the hardware design of the
# board. Where it comes from, in order of priority:
#
#   1. PS7_INIT_SRC=/path/...   your own: a ps7_init_gpl.c, a directory containing
#                               ps7_init_gpl.c + .h, or a Vivado/Vitis hardware
#                               handoff archive (.hdf / .xsa) that contains them.
#                               Use this when you have your own PS configuration.
#   2. the pinned download below: the hardware handoff of Digilent's Eclypse-Z7-OS
#                               project (Vivado 2019.1, board preset
#                               digilentinc.com:eclypse-z7:1.0), fetched by commit and
#                               checked against its sha256.
#
# The file is NOT committed to this repository. Its header grants GPL-2.0-or-later,
# but the project it lives in carries no top-level licence file, so this repository
# downloads it instead of redistributing it. See docs/03-uboot-spl.md.
# -----------------------------------------------------------------------------
: "${PS7_INIT_SRC:=}"
: "${PS7_INIT_URL:=https://raw.githubusercontent.com/Digilent/Eclypse-Z7-OS/8d74b26ea6bdccbf7127d054204069f4e26b4801/project-spec/hw-description/system.hdf}"
: "${PS7_INIT_SHA256:=b7f74d49bf9456cef08f9bf2a7b75df93691ea573c8ed4e25ab4aea1854ae937}"

# -----------------------------------------------------------------------------
# Linux kernel: a stable tarball from kernel.org (about 150 MB, no git history)
# -----------------------------------------------------------------------------
: "${KERNEL_VERSION:=6.18.58}"
: "${KERNEL_URL:=https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz}"
: "${KERNEL_SHA256:=069b19f9032c4dac8149ae4b6520c35debca0f42a9f6d52ee55ba6ca9b818013}"
# The generic 32-bit ARMv7 defconfig; it covers every Cortex-A SoC the kernel supports,
# Zynq-7000 included (ARCH_ZYNQ=y). The kernel has no xilinx_zynq_defconfig of its own.
: "${KERNEL_DEFCONFIG:=multi_v7_defconfig}"
# Appended to `uname -r`, e.g. 6.18.58-custom
: "${KERNEL_LOCALVERSION:=-custom}"
# 32-bit ARM kernels are loaded by U-Boot's bootz as a self-extracting zImage.
: "${KERNEL_IMAGE:=zImage}"
# Device trees to build (names under arch/arm/boot/dts/xilinx). The FIRST one is written
# into extlinux.conf. zynq-eclypse-z7.dts comes from custom/dts/.
: "${KERNEL_DTBS:=xilinx/zynq-eclypse-z7.dtb}"

# -----------------------------------------------------------------------------
# Cross toolchain (Arm GNU Toolchain, 32-bit hard-float Linux target). One compiler builds
# the U-Boot SPL, U-Boot proper and the kernel.
#   arm    -> download the pinned toolchain into build/toolchain
#   system -> use arm-linux-gnueabihf-gcc from $PATH
#             (sudo apt install gcc-arm-linux-gnueabihf; works, but not reproducible)
# The download matches your PC: x86-64 or ARM64 (Apple-silicon Linux VM, Ampere...).
# -----------------------------------------------------------------------------
: "${TOOLCHAIN:=arm}"
: "${ARM_TOOLCHAIN_VERSION:=14.3.rel1}"
: "${ARM_TOOLCHAIN_BASE_URL:=https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel}"
: "${ARM_TC_SHA256_x86_64:=3ec0113af5154a2573b3851d74d9e9501a805abf9dfa0f82b04ef26fa0e6fc35}"
: "${ARM_TC_SHA256_aarch64:=547a618cafac3a587dbaa0d866208987a9d855eefc64012c933560c287f66837}"
# Use ccache automatically when it is installed (makes rebuilds much faster)
: "${USE_CCACHE:=auto}"

# -----------------------------------------------------------------------------
# Root filesystem (see docs/05-rootfs.md). Both are 32-bit ARM hard-float.
#   debian           -> Debian "armhf" built with mmdebstrap (needs qemu-user on an x86 or ARM64 PC)
#   alpine           -> the tiny Alpine "armv7" minirootfs (download, no root, no emulation)
#   /path/to/rootfs.tar[.gz|.xz|.zst|.bz2]
#                    -> use your own tarball (it must be 32-bit ARMv7 hard-float)
# -----------------------------------------------------------------------------
: "${ROOTFS:=debian}"
: "${DEBIAN_SUITE:=trixie}"
: "${DEBIAN_MIRROR:=http://deb.debian.org/debian}"
# Debian's archive signing keys (see the i.MX board for why the keyring package is downloaded).
: "${DEBIAN_KEYRING_URL:=https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb}"
: "${DEBIAN_KEYRING_SHA256:=9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac}"
: "${DEBIAN_PACKAGES:=systemd-sysv udev dbus kmod iproute2 iputils-ping netbase openssh-server sudo less nano vim-tiny ca-certificates tzdata systemd-timesyncd util-linux-extra e2fsprogs parted fdisk usbutils i2c-tools ethtool wget curl htop}"
: "${ALPINE_VERSION:=3.24.2}"
: "${TARGET_HOSTNAME:=eclypse-z7}"
: "${TARGET_USER:=dev}"
# Default password for root and $TARGET_USER. It is a BENCH DEFAULT: change it
# (or set TARGET_PASSWORD in config/local.conf) on anything that leaves your desk.
: "${TARGET_PASSWORD:=zynq7000}"
# The serial console: PS UART0 on MIO 14/15, wired to the board's FT2232HQ USB-UART
# (connector J6). The kernel names it ttyPS0 (the Linux Cadence/Xilinx PS UART driver).
: "${TARGET_CONSOLE:=ttyPS0}"
: "${CONSOLE_BAUD:=115200}"

# -----------------------------------------------------------------------------
# SD card image layout (see docs/06-sdcard-image.md and docs/images/sd-layout.svg)
#
# An MBR ("DOS") disk: the Zynq BootROM does not read GPT. It looks for the first FAT16/FAT32
# partition and opens BOOT.BIN in its root directory.
#
#   1 MiB   p1  FAT32, label BOOT, bootable   BOOT.BIN u-boot.img zImage zynq-eclypse-z7.dtb extlinux/extlinux.conf
#   301 MiB p2  ext4, label rootfs             the root filesystem (+ /lib/modules)
#
# The root partition is named in the kernel command line by its MBR PARTUUID
# (<disk signature>-02), so it does not matter what number Linux gives the SD card.
# -----------------------------------------------------------------------------
: "${BOOT_PART_START_MB:=1}"
# 300 MiB, not less: mkfs.vfat then makes 4 KiB clusters, the geometry every PC-formatted card has
# (a FAT32 volume of 64 MiB would get 512-byte clusters, which is legal but unusual).
: "${BOOT_PART_SIZE_MB:=300}"
: "${BOOT_LABEL:=BOOT}"
: "${ROOTFS_LABEL:=rootfs}"
# 32-bit MBR disk identifier ("disk signature"). PARTUUID=<this>-02 is the root partition.
: "${DISK_SIGNATURE:=5a796e71}"
# Free space (MiB) added on top of the rootfs content. The partition can also
# be grown to the full card when flashing (./build.sh flash --expand).
: "${IMAGE_EXTRA_MB:=512}"
# Kernel command line (see docs/04-kernel.md). "earlycon" prints kernel messages from the very first
# instruction on the same UART: it is a first-boot aid, remove it once the board boots.
: "${KERNEL_CMDLINE_EXTRA:=rootwait rw earlycon}"
