# Default fragment merged on top of multi_v7_defconfig (see README.md here).
#
# Keep `uname -r` predictable: "6.18.58-custom" instead of
# "6.18.58-custom-g<git-sha>" (LOCALVERSION_AUTO appends the git hash).
# CONFIG_LOCALVERSION_AUTO is not set
#
# The Zynq's programmable logic: let Linux load a bitstream later (not needed to boot).
# The driver is a module and the PL stays unconfigured until you write a bitstream.
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=m
