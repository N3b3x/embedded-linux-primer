<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-label="Source files that run during boot, in order: the BootROM in silicon; in u-boot the SPL linker script, the SPL start-up that calls ps7_init and picks the boot device, the Makefile that compiles the board's PS7 init file, the SD and FAT loaders and the zynqimage wrapper; U-Boot proper's board code, environment defaults, distro boot script, sysboot and bootz; and in linux the Zynq device tree, machine code, clock, UART, SD, Ethernet and FPGA manager drivers, and kernel_init."><rect x="0" y="0" width="1400" height="1190" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">The code that runs, in order: power-on to /sbin/init</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">The files to open when you want to understand or change a step. Paths are inside build/src/ after ./build.sh uboot and ./build.sh kernel.</text><rect x="32" y="100" width="1336" height="68" rx="14" fill="#141f35" stroke="#64748b" stroke-width="1.6"/><rect x="32" y="100" width="170" height="68" rx="14" fill="#475569"/><text x="117" y="130" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="18" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">BootROM</text><text x="117" y="152" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", 