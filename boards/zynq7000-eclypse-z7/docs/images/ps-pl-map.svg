<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-label="The Zynq-7000 on the Eclypse Z7: the hard processing system with two Cortex-A9 cores, L2 cache, on-chip RAM, the DDR3 controller and peripherals on MIO pins (UART0, SD0, Ethernet GEM0, USB0, QSPI, I2C1), linked by AXI interconnect, clocks and interrupts to the programmable logic, an empty FPGA fabric whose pins go to the two Zmod ports and the Pmods."><rect x="0" y="0" width="1400" height="880" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker><marker id="m-f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">One chip, two halves: the processing system (PS) and the programmable logic (PL)</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">The XC7Z020 on the Eclypse Z7. This build boots and uses the PS only; the PL is an FPGA that stays empty until someone loads a design.</text><rect x="40" y="112" width="640" height="470" rx="18" fill="#06140f" stroke="#0f4d43" stroke-width="1.4"/><text x="60" y="140" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#5eead4;white-space:pre" letter-spacing="1.1">PS  ·  PROCESSING SYSTEM  (hard silicon, always there)</text><rect x="60" y="160" width="290" height="78" rx="10" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><text x="72" y="184" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#5eead4;white-space:pre">APU: 2 × Cortex-A9</text><text x="72" y="203" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">32-bit ARMv7, NEON, up to 667 MHz (-1 part)</text><rect x="370" y="160" width="290" height="78" rx="10" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.3"/><text x="382" y="184" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">L2 cache 512 KiB · OCM 256 KiB</text><text x="382" y="203" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">OCM: where the BootROM puts BOOT.BIN</text><rect x="60" y="252" width="600" height="70" rx="10" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.3"/><text x="72" y="276" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fda4af;white-space:pre">DDR3/3L memory controller</text><text x="72" y="295" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">1 GiB on the Eclypse Z7 · needs ps7_init before first use</text><text x="60" y="350" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="10.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#64748b;white-space:pre" letter-spacing="1.1">PERIPHERALS ON THE 54 MIO PINS</text><rect x="60" y="364" width="192" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="72" y="388" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">UART0</text><text x="72" y="407" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">MIO 14-15</text><text x="240" y="388" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre"></text><rect x="264" y="364" width="192" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="276" y="388" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">SD0</text><text x="276" y="407" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">MIO 40-45, 47</text><text x="444" y="388" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre"></text><rect x="468" y="364" width="192" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="480" y="388" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">GEM0</text><text x="480" y="407" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">MIO 16-27</text><text x="648" y="388" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre"></text><rect x="60" y="426" width="192" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="72" y="450" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">USB0</text><text x="72" y="469" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">MIO 28-39</text><text x="240" y="450" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre"></text><rect x="264" y="426" width="192" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="276" y="450" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">QSPI</text><text x="276" y="469" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">MIO 1-6, 8</text><text x="444" y="450" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre"></text><rect x="468" y="426" width="192" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="480" y="450" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">I2C1</text><text x="480" y="469" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">MIO 12-13</text><text x="648" y="450" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="10" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre"></text><text x="60" y="508" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">also: SPI, CAN, GPIO, timers, watchdog, DMA, the FPGA manager (devcfg, loads PL bitstreams)</text><text x="60" y="532" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Linux drives all of these with ordinary drivers; the device tree only says where they are.</text><text x="60" y="556" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Enabled in custom/dts/zynq-eclypse-z7.dts: uart0, sdhci0, gem0, gpio0, i2c1, qspi, usb0, devcfg.</text><rect x="760" y="112" width="600" height="470" rx="18" fill="#1c1405" stroke="#7c4a0a" stroke-width="1.4" stroke-dasharray="8 5"/><text x="780" y="140" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre" letter-spacing="1.1">PL  ·  PROGRAMMABLE LOGIC  (an FPGA, empty at power-on)</text><rect x="780" y="160" width="560" height="200" rx="12" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="6 4"/><text x="796" y="188" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fde68a;white-space:pre">your design, once a bitstream is loaded</text><text x="796" y="214" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">XC7Z020: 53,200 LUTs · 106,400 flip-flops</text><text x="796" y="234" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">140 block RAMs · 220 DSP slices (Artix-7 class fabric)</text><text x="796" y="254" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre"></text><text x="796" y="274" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Examples: a Zmod ADC controller + AXI DMA,</text><text x="796" y="294" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">a custom accelerator, soft peripherals, glue logic.</text><rect x="780" y="378" width="280" height="60" rx="10" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.3"/><text x="792" y="402" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">Clocks from the PS</text><text x="792" y="421" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">FCLK0-3; the board also feeds 125 MHz</text><rect x="1080" y="378" width="260" height="60" rx="10" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.3"/><text x="1092" y="402" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">Interrupts to the PS</text><text x="1092" y="421" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">IRQ_F2P[15:0]: GIC SPI 29-36, 52-59</text><text x="780" y="468" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="10.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#64748b;white-space:pre" letter-spacing="1.1">THE FABRIC'S PINS ARE WIRED TO</text><rect x="780" y="480" width="180" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="792" y="504" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">Zmod port A</text><text x="792" y="523" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">SYZYGY, own I/O bank</text><rect x="972" y="480" width="180" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="984" y="504" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">Zmod port B</text><text x="984" y="523" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">SYZYGY, own I/O bank</text><rect x="1164" y="480" width="176" height="52" rx="10" fill="#141f35" stroke="#64748b" stroke-width="1.3"/><text x="1176" y="504" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">Pmods, LEDs</text><text x="1176" y="523" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">buttons, 125 MHz clock</text><text x="780" y="558" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">Nothing here exists until a bitstream is loaded: the I/O pins are unconfigured and no AXI slave answers.</text><rect x="40" y="596" width="1320" height="64" rx="12" fill="#121c33" stroke="#fcd34d" stroke-width="1.5"/><text x="58" y="622" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">AXI interconnect between PS and PL</text><text x="58" y="644" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">GP ports (PS reads/writes PL registers) · HP ports (PL masters write straight into DDR) · ACP (coherent) · EMIO (PL-routed PS peripherals) · FCLK · IRQ_F2P</text><line x1="370" y1="578" x2="370" y2="598" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" marker-end="url(#m-f)"/><line x1="910" y1="578" x2="910" y2="598" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" marker-end="url(#m-f)"/><text x="40" y="686" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre" letter-spacing="1.3">HOW THIS DIFFERS FROM THE OTHER BOARDS OF THIS REPOSITORY</text><rect x="40" y="694" width="1320" height="2" rx="1" fill="#26344f"/><text x="40" y="720" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">• i.MX 8M Plus and STM32MP2 are 64-bit SoCs with a vendor boot chain (ATF, OP-TEE) and a fixed set of peripherals. The Zynq-7000 is 32-bit, has no secure monitor in this build,</text><text x="40" y="742" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">  and the first stage is ours: the SPL must configure the clocks and DDR itself, from a file generated for this board's hardware design.</text><text x="40" y="764" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">• Those SoCs have no FPGA. Here half the chip is a blank slate, and the hardware you will actually use (a Zmod ADC) lives in it: docs/13 explains the order of work.</text><text x="32" y="844" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">Block sizes: the XC7Z020 entry of the project's sysdef (LUT 53,200 · FF 106,400 · BRAM 140 · DSP 220); MIO assignments: Eclypse Z7 reference manual and the Vivado board preset.</text><text x="32" y="864" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">IRQ_F2P ranges: UG585 table 7-4 (GIC SPI 29-36 and 52-59). The PL accesses DDR through the HP ports; the Zynq-7000 has no IOMMU for them.</text></svg>
