<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-label="SD card layout: an MBR disk with a 300 MiB FAT32 partition labelled BOOT from 1 MiB, holding BOOT.BIN for the BootROM, u-boot.img for the SPL, extlinux/extlinux.conf, zImage and the device tree for U-Boot, and an ext4 rootfs partition from 301 MiB that holds the root filesystem and the kernel modules."><rect x="0" y="0" width="1400" height="930" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">What is on the SD card, and who reads each file</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">An MBR disk with two partitions, written by scripts/image.sh. The BootROM only understands MBR + FAT, so the layout is not a free choice.</text><text x="40" y="132" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#64748b;white-space:pre" letter-spacing="1.2">THE DISK, LEFT TO RIGHT (not to scale: p1 is 300 MiB, p2 is as large as its content, or the whole card after --expand)</text><rect x="40" y="150" width="1320" height="64" rx="8" fill="#0a1424" stroke="#26344f" stroke-width="1.2"/><text x="68" y="186" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">MBR</text><rect x="96" y="150" width="640" height="64" rx="3" fill="#2563eb" stroke="#3b82f6" stroke-width="1"/><rect x="736" y="150" width="624" height="64" rx="3" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1"/><text x="416" y="178" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="15" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">p1  FAT32 "BOOT"</text><text x="416" y="198" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve" style="fill:#dbeafe;white-space:pre">starts at 1 MiB, 300 MiB long</text><text x="1046" y="178" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="15" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">p2  ext4 "rootfs"</text><text x="1046" y="198" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve" style="fill:#ede9fe;white-space:pre">starts at 301 MiB, to the end</text><line x1="40" y1="214" x2="40" y2="222" stroke="#64748b" stroke-width="1"/><text x="40" y="236" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">0</text><line x1="96" y1="214" x2="96" y2="222" stroke="#64748b" stroke-width="1"/><text x="96" y="236" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">1 MiB · sector 2048</text><line x1="736" y1="214" x2="736" y2="222" stroke="#64748b" stroke-width="1"/><text x="736" y="236" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">301 MiB · sector 616448</text><rect x="40" y="290" width="428" height="214" rx="12" fill="#121c33" stroke="#64748b" stroke-width="1.6"/><path d="M40,302 a12,12 0 0 1 12,-12 h404 a12,12 0 0 1 12,12 v28 h-428 z" fill="#475569"/><text x="54" y="315" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#ffffff;white-space:pre">MBR  (sector 0)</text><text x="456" y="315" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">512 bytes</text><text x="54" y="356" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">disk signature</text><text x="54" y="372" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">0x5a796e71</text><text x="54" y="392" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">entry 1</text><text x="54" y="408" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">FAT32 (type 0c), active, start 2048, 614400 sectors</text><text x="54" y="428" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">entry 2</text><text x="54" y="444" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">Linux (type 83), start 616448</text><text x="54" y="464" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">read by</text><text x="54" y="480" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">BootROM (finds partition 1), the kernel (PARTUUID)</text><rect x="486" y="290" width="428" height="214" rx="12" fill="#121c33" stroke="#3b82f6" stroke-width="1.6"/><path d="M486,302 a12,12 0 0 1 12,-12 h404 a12,12 0 0 1 12,12 v28 h-428 z" fill="#2563eb"/><text x="500" y="315" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#ffffff;white-space:pre">p1  BOOT  (FAT32)</text><text x="902" y="315" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">300 MiB</text><text x="500" y="356" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">BOOT.BIN</text><text x="500" y="372" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">BootROM loads it into OCM: the SPL</text><text x="500" y="392" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">u-boot.img</text><text x="500" y="408" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">the SPL loads it into DDR</text><text x="500" y="428" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">extlinux/extlinux.conf</text><text x="500" y="444" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">U-Boot's distro boot reads it</text><text x="500" y="464" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">zImage, zynq-eclypse-z7.dtb</text><text x="500" y="480" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">U-Boot loads both, boots</text><rect x="932" y="290" width="428" height="214" rx="12" fill="#121c33" stroke="#8b5cf6" stroke-width="1.6"/><path d="M932,302 a12,12 0 0 1 12,-12 h404 a12,12 0 0 1 12,12 v28 h-428 z" fill="#7c3aed"/><text x="946" y="315" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#ffffff;white-space:pre">p2  rootfs  (ext4)</text><text x="1348" y="315" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">rest of card</text><text x="946" y="356" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#c4b5fd;white-space:pre">/sbin/init  /usr  /etc …</text><text x="946" y="372" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">the distribution</text><text x="946" y="392" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#c4b5fd;white-space:pre">/lib/modules/6.18.58-custom</text><text x="946" y="408" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">drivers built as modules</text><text x="946" y="428" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#c4b5fd;white-space:pre">/boot/config-6.18.58-custom</text><text x="946" y="444" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">the kernel's .config</text><text x="946" y="464" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#c4b5fd;white-space:pre">/boot/firmware</text><text x="946" y="480" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">mount point of p1 on the running board</text><text x="40" y="530" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre" letter-spacing="1.3">WHAT U-BOOT READS FROM p1</text><rect x="40" y="538" width="1320" height="2" rx="1" fill="#26344f"/><rect x="40" y="554" width="600" height="173" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="54" y="576" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#64748b;white-space:pre">/extlinux/extlinux.conf (written by image.sh)</text><text x="54" y="600" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">DEFAULT linux</text><text x="54" y="619" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">TIMEOUT 10</text><text x="54" y="638" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">LABEL linux</text><text x="54" y="657" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#5eead4;white-space:pre">  LINUX /zImage</text><text x="54" y="676" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#c4b5fd;white-space:pre">  FDT /zynq-eclypse-z7.dtb</text><text x="54" y="695" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">  APPEND root=PARTUUID=5a796e71-02 console=ttyPS0,115200</text><text x="54" y="714" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">         rootwait rw earlycon</text><rect x="660" y="554" width="700" height="192" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="676" y="578" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Why these rules</text><text x="676" y="602" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">• BootROM: MBR only; the first FAT16/FAT32 partition; the file must be</text><text x="676" y="621" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">  called BOOT.BIN, in the root directory. No GPT, no ext4.</text><text x="676" y="640" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">• SPL: opens u-boot.img by name on that same partition.</text><text x="676" y="659" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">• U-Boot: scans the partition with the active flag first, then looks for</text><text x="676" y="678" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">  /extlinux/extlinux.conf; paths in it are relative to the FAT root.</text><text x="676" y="697" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">• Linux: root=PARTUUID=&lt;disk signature&gt;-02 finds p2 on any mmcblk number.</text><rect x="40" y="762" width="1320" height="90" rx="10" fill="#0f192d" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="7 5"/><text x="58" y="788" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre" letter-spacing="1.2">LATER, WITH A BITSTREAM FOR THE PL: THE LAYOUT STAYS</text><text x="58" y="810" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Only BOOT.BIN is swapped (./build.sh flash --firmware-only): Xilinx route = FSBL + .bit + u-boot.elf packed by bootgen into one BOOT.BIN, same name, same place.</text><text x="58" y="832" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Or keep this BOOT.BIN and add system.bit.bin next to zImage; U-Boot (fpga load) or Linux (/lib/firmware, fpga_manager) programs the PL. See docs/13 and docs/03.</text><text x="32" y="896" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">Sizes and the disk signature: config/eclypse-z7.conf. BootROM rules: UG585 chapter 6 (boot and configuration) and the Eclypse Z7 reference manual, section 2 (boot modes).</text><text x="32" y="916" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">U-Boot looks for extlinux.conf with boot_prefixes "/ /boot/" (include/config_distro_bootcmd.h); the file lives in /extlinux/ because the FAT root is the prefix "/".</text></svg>
