<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="Memory map during boot: in the 256 KiB on-chip SYSRAM at 0x2FFC0000, OP-TEE's header and pager at the bottom, BL2's device tree at 0x2FFE2000, BL2 at 0x2FFE9000 and a non-secure last page for fw-config; in the 512 MiB of DDR3 from 0xC0000000, U-Boot loaded at 0xC0100000 with its device tree at 0xC0500000, U-Boot's load addresses for the kernel and device tree at 0xC2000000 and 0xC4000000, and OP-TEE's 32 MiB of secure RAM at the top, 0xDE000000, reserved from Linux."><rect x="0" y="0" width="1400" height="760" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Where things live in memory during boot</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">Two address ranges matter: 256 KiB of on-chip SYSRAM (BL2 and OP-TEE's pager), and the 512 MiB of DDR3 that starts at 0xC000_0000.</text><text x="40" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre" letter-spacing="1">ON-CHIP SYSRAM  0x2FFC0000 – 0x30000000  (256 KiB)</text><rect x="40" y="124" width="560" height="560" rx="10" fill="#0a1424" stroke="#26344f" stroke-width="1.2"/><rect x="50" y="134" width="540" height="70" rx="8" fill="#141f35" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="64" y="156" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">Last page: non-secure, fw-config</text><text x="576" y="156" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">0x2FFFF000</text><text x="64" y="176" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">4 KiB. BL2 reads fw-config here; TF-A's docs call it the "SCMI mailbox"</text><text x="64" y="192" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">(OP-TEE uses it for SCMI only if CFG_STM32MP1_SCMI_SHM_SYSRAM=y; off by default)</text><rect x="50" y="214" width="540" height="150" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1.4"/><text x="64" y="236" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">BL2 image</text><text x="576" y="236" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x2FFE9000</text><text x="64" y="256" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">STM32MP_BL2_SIZE 0x16000 (88 KB), up to the last page. Entry point 0x2FFE9000</text><text x="64" y="272" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">in the header of this build; the ROM copies the whole .stm32 payload</text><text x="64" y="288" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">(209,060 bytes after the 256-byte header) to 0x2FFC2500 and jumps to the entry</text><rect x="50" y="374" width="540" height="70" rx="8" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.4"/><text x="64" y="396" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">BL2 device tree</text><text x="576" y="396" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x2FFE2000</text><text x="64" y="416" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">BL2's own DTB (28 KiB reserved, STM32MP_BL2_DTB_SIZE): clocks, DDR, PMIC</text><rect x="50" y="454" width="540" height="150" rx="8" fill="#e11d48" stroke="#f43f5e" stroke-width="1.4"/><text x="64" y="476" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">OP-TEE header + pager</text><text x="576" y="476" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x2FFC0000</text><text x="64" y="496" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">STM32MP_OPTEE_BASE: BL2 loads tee-header and tee-pager here, below its own device tree.</text><text x="64" y="512" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">OP-TEE then owns the whole 256 KiB (CFG_TZSRAM_START 0x2FFC0000, size 0x40000)</text><text x="64" y="528" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">and pages the rest of itself in from secure DDR.</text><text x="64" y="544" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">OP-TEE stays for the whole life of the system.</text><text x="54" y="636" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">0x2FFC0000 = STM32MP_SYSRAM_BASE · size 0x40000 (MP15) · NS page = last 4 KiB</text><text x="54" y="658" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">plat/st/stm32mp1/stm32mp1_def.h, stm32mp1_fip_def.h; BL2 address confirmed in the linker map of this build</text><text x="640" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre" letter-spacing="1">DDR  0xC0000000 – 0xE0000000  (512 MiB DDR3, drawn NOT to scale)</text><rect x="640" y="124" width="720" height="560" rx="10" fill="#0a1424" stroke="#26344f" stroke-width="1.2"/><rect x="650" y="134" width="700" height="66" rx="8" fill="#e11d48" stroke="#f43f5e" stroke-width="1.4"/><text x="664" y="156" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">OP-TEE secure RAM (TZDRAM)</text><text x="1336" y="156" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0xDE000000</text><text x="664" y="176" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">32 MiB (CFG_TZDRAM_START/SIZE = 0xDE000000 / 0x02000000): the top of the 512 MiB, firewalled by the TZC-400.</text><text x="664" y="192" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">Reserved from Linux as optee@de000000, no-map</text><rect x="650" y="210" width="700" height="44" rx="8" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="6 4"/><text x="664" y="232" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">free DDR</text><text x="1336" y="232" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#93c5fd;white-space:pre">...</text><text x="664" y="252" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">after bootz the kernel runs from here; Linux owns everything not reserved</text><rect x="650" y="264" width="700" height="76" rx="8" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.4"/><text x="664" y="286" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">kernel_addr_r ... ramdisk_addr_r</text><text x="1336" y="286" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0xC2000000 ...</text><text x="664" y="306" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">U-Boot's load addresses: zImage at 0xC2000000, DTB at 0xC4000000 (fdt_addr_r),</text><text x="664" y="322" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">script 0xC4100000, extlinux.conf text 0xC4200000, overlays 0xC4300000, ramdisk 0xC4400000</text><rect x="650" y="350" width="700" height="54" rx="8" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.4"/><text x="664" y="372" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">U-Boot's DTB (hw-config)</text><text x="1336" y="372" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0xC0500000</text><text x="664" y="392" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">BL2 puts u-boot.dtb here (up to 256 KiB), U-Boot reads it at start</text><rect x="650" y="414" width="700" height="66" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1.4"/><text x="664" y="436" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">U-Boot as loaded (BL33)</text><text x="1336" y="436" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0xC0100000</text><text x="664" y="456" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">u-boot-nodtb.bin, up to 4 MiB (STM32MP_BL33_MAX_SIZE); U-Boot then relocates itself to</text><text x="664" y="472" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">the top of the non-secure DDR.</text><rect x="650" y="490" width="700" height="54" rx="8" fill="#141f35" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="664" y="512" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">start of DDR</text><text x="1336" y="512" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">0xC0000000</text><text x="664" y="532" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">STM32MP_DDR_BASE. The kernel's own memory node: memory@c0000000, 0x20000000 bytes</text><rect x="650" y="560" width="700" height="108" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="664" y="582" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#64748b;white-space:pre">where the numbers come from</text><text x="664" y="606" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">DDR_BASE        0xC0000000  plat/st/stm32mp1/stm32mp1_def.h</text><text x="664" y="623" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">BL33_BASE       DDR_BASE + 0x100000 = 0xC0100000   BL33_MAX_SIZE 0x400000</text><text x="664" y="640" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#c4b5fd;white-space:pre">HW_CONFIG_BASE  BL33_BASE + BL33_MAX_SIZE = 0xC0500000</text><text x="664" y="657" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#fda4af;white-space:pre">OP-TEE          fdts/stm32mp15-fw-config.dtsi: DDR_SIZE 0x20000000 - 0x02000000 = 0xDE000000</text><text x="32" y="742" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">U-Boot addresses: include/configs/stm32mp15_common.h (__KERNEL_ADDR_R, __FDT_ADDR_R ...). Kernel reservation: arch/arm/boot/dts/st/stm32mp157f-dk2-scmi.dtsi.</text></svg>
