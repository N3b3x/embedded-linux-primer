# shellcheck shell=bash
# =============================================================================
#  Board / BSP configuration for the STMicroelectronics STM32MP157F-DK2
#  (STM32MP157F Discovery Kit; see docs/12-board-tour.md)
# =============================================================================
#
#  This file is *sourced* by every script in scripts/. It only sets variables.
#
#  Every value uses the form  : "${VAR:=default}"  which means:
#     "if VAR is already set in the environment, keep it, otherwise use default"
#  So you can override anything for a single run without editing this file:
#
#     KERNEL_VERSION=6.12.57 KERNEL_SHA256=<sum> ./build.sh kernel
#
#  Or keep your overrides in config/local.conf (git-ignored), which build.sh
#  sources *before* this file.
#
#  Like the STM32MP257F-DK board in this repository, every source here is
#  UPSTREAM: the projects' own repositories, not a vendor fork, at the same
#  releases as that board (see docs/10-versions.md).
#
#  *_REV variables pin a git commit for reproducible builds. Set one to an empty
#  string (e.g. UBOOT_REV=) to follow the tip of the ref instead.
# =============================================================================

# -----------------------------------------------------------------------------
# Release name, used only in banners/log messages and the image file name
# -----------------------------------------------------------------------------
: "${BSP_RELEASE:=upstream-2026.10}"
: "${BOARD_NAME:=stm32mp157f-dk2}"

# -----------------------------------------------------------------------------
# Trusted Firmware-A (TF-A): on this 32-bit SoC only BL2 is built (the first
# thing the Boot ROM runs). There is no BL31: OP-TEE itself is the secure monitor.
# -----------------------------------------------------------------------------
: "${TFA_REPO:=https://review.trustedfirmware.org/TF-A/trusted-firmware-a}"
: "${TFA_BRANCH:=v2.15.0}"
: "${TFA_REV:=da738d5eae93af342fdc4995dd3c05acb4c9d757}"
: "${TFA_PLATFORM:=stm32mp1}"
# The device tree TF-A is built for. TF-A has its own small copies of the board
# trees (fdts/): clock tree, 512 MB DDR3 settings, PMIC, and the "fw-config"
# that says where each image goes.
: "${TFA_DTB:=stm32mp157f-dk2.dtb}"
# Boot medium compiled into BL2. STM32MP_SDMMC=1: read the FIP from SD/eMMC.
: "${TFA_BOOT_FLAG:=STM32MP_SDMMC=1}"
# Secure payload: AARCH32_SP=optee = BL32 is OP-TEE. (The alternative, sp_min, is
# "not recommended" by TF-A's own docs/plat/st/stm32mp1.rst.)
: "${TFA_SPD:=AARCH32_SP=optee}"
# TF-A log level: 10 error, 20 notice (what ST ships), 30 warning, 40 info, 50 verbose.
# Use 40 to see every step of BL2 on the console while you bring a board up.
: "${TFA_LOG_LEVEL:=20}"

# -----------------------------------------------------------------------------
# OP-TEE OS: the trusted OS and, on a 32-bit SoC, also the secure monitor. It is
# the SCMI server that owns the clocks, resets and voltage regulators
# (see docs/11-secure-world-and-scmi.md)
# -----------------------------------------------------------------------------
: "${OPTEE_REPO:=https://github.com/OP-TEE/optee_os.git}"
: "${OPTEE_BRANCH:=4.11.0}"
: "${OPTEE_REV:=f54190f22611dd5ad5d22546fd4209aa100f56bd}"
: "${OPTEE_PLATFORM:=stm32mp1}"
# OP-TEE 4.11.0 has no stm32mp157f-dk2.dts. The DK2 "SCMI" tree is the one whose
# Linux counterpart (stm32mp157f-dk2.dts) takes its clocks, resets and supplies over SCMI.
# It is also in OP-TEE's 512 MB list, which puts the secure RAM at 0xde000000.
: "${OPTEE_DTS:=stm32mp157c-dk2-scmi.dts}"

# -----------------------------------------------------------------------------
# U-Boot (BL33): the normal-world bootloader
# -----------------------------------------------------------------------------
: "${UBOOT_REPO:=https://github.com/u-boot/u-boot.git}"
: "${UBOOT_BRANCH:=v2026.07}"
: "${UBOOT_REV:=ece349ade2973e220f524ce59e59711cc919263f}"
: "${UBOOT_DEFCONFIG:=stm32mp15_defconfig}"
# U-Boot builds its device tree from a copy of the Linux sources ("OF_UPSTREAM",
# dts/upstream/src/arm/): vendor directory + dts name, without the extension.
# U-Boot has no -u-boot.dtsi for stm32mp157f-dk2 (see docs/03), so the board-identical
# C-variant SCMI tree is used, as U-Boot's own doc/board/st/stm32mp1.rst lists for DK2.
: "${UBOOT_DEVICE_TREE:=st/stm32mp157c-dk2-scmi}"

# -----------------------------------------------------------------------------
# Linux kernel: a stable tarball from kernel.org (about 150 MB, no git history)
# -----------------------------------------------------------------------------
: "${KERNEL_VERSION:=6.18.58}"
: "${KERNEL_URL:=https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz}"
: "${KERNEL_SHA256:=069b19f9032c4dac8149ae4b6520c35debca0f42a9f6d52ee55ba6ca9b818013}"
# multi_v7_defconfig is the generic 32-bit ARMv7 configuration (stm32_defconfig is
# for the Cortex-M microcontrollers and must NOT be used on this MPU).
: "${KERNEL_DEFCONFIG:=multi_v7_defconfig}"
# Appended to `uname -r`, e.g. 6.18.58-custom
: "${KERNEL_LOCALVERSION:=-custom}"
# 32-bit ARM kernels are loaded by U-Boot's bootz as a compressed "zImage".
: "${KERNEL_IMAGE:=zImage}"
# Device trees to build and install into /boot (names under arch/arm/boot/dts/st).
# The FIRST one is written into extlinux.conf.
: "${KERNEL_DTBS:=st/stm32mp157f-dk2.dtb}"

# -----------------------------------------------------------------------------
# Cross toolchains (Arm GNU Toolchain). Two are needed:
#   arm-none-eabi            bare-metal: TF-A BL2 and the OP-TEE core (no libc, no OS)
#   arm-none-linux-gnueabihf Linux user space: the kernel and U-Boot (and OP-TEE's TA libs)
# The download matches your PC: x86-64 or ARM64 (Apple-silicon Linux VM, Ampere...).
#   arm    -> download the pinned toolchains into build/toolchain
#   system -> use arm-linux-gnueabihf-gcc from $PATH for everything
#             (sudo apt install gcc-arm-linux-gnueabihf; works, but not reproducible)
# -----------------------------------------------------------------------------
: "${TOOLCHAIN:=arm}"
: "${ARM_TOOLCHAIN_VERSION:=14.3.rel1}"
: "${ARM_TOOLCHAIN_BASE_URL:=https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel}"
: "${ARM_TC_SHA256_x86_64_elf:=8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd}"
: "${ARM_TC_SHA256_x86_64_linux:=3ec0113af5154a2573b3851d74d9e9501a805abf9dfa0f82b04ef26fa0e6fc35}"
: "${ARM_TC_SHA256_aarch64_elf:=2d465847eb1d05f876270494f51034de9ace9abe87a4222d079f3360240184d3}"
: "${ARM_TC_SHA256_aarch64_linux:=547a618cafac3a587dbaa0d866208987a9d855eefc64012c933560c287f66837}"
# Use ccache automatically when it is installed (makes rebuilds much faster)
: "${USE_CCACHE:=auto}"

# -----------------------------------------------------------------------------
# Root filesystem (see docs/05-rootfs.md)
#   debian           -> build a Debian armhf rootfs with mmdebstrap
#   alpine           -> download the tiny Alpine armv7 minirootfs (no root needed,
#                       handy for a quick bring-up / smoke test)
#   /path/to/rootfs.tar[.gz|.xz|.zst|.bz2]
#                    -> use your own tarball
# -----------------------------------------------------------------------------
: "${ROOTFS:=debian}"
: "${DEBIAN_SUITE:=trixie}"
: "${DEBIAN_ARCH:=armhf}"
: "${DEBIAN_MIRROR:=http://deb.debian.org/debian}"
# Debian's archive signing keys. Ubuntu (and older Debian) hosts do not have
# the trixie keys, so the official keyring package is downloaded (checksum
# pinned) and handed to mmdebstrap with --keyring.
: "${DEBIAN_KEYRING_URL:=https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb}"
: "${DEBIAN_KEYRING_SHA256:=9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac}"
: "${DEBIAN_PACKAGES:=systemd-sysv udev dbus kmod iproute2 iputils-ping netbase openssh-server sudo less nano vim-tiny ca-certificates tzdata systemd-timesyncd util-linux-extra e2fsprogs parted fdisk usbutils i2c-tools can-utils ethtool wget curl htop}"
: "${ALPINE_VERSION:=3.24.2}"
: "${ALPINE_ARCH:=armv7}"
: "${TARGET_HOSTNAME:=stm32mp157f-dk2}"
: "${TARGET_USER:=dev}"
# Default password for root and $TARGET_USER. It is a BENCH DEFAULT: change it
# (or set TARGET_PASSWORD in config/local.conf) on anything that leaves your desk.
: "${TARGET_PASSWORD:=stm32mp1}"
# The serial console of the DK2: UART4, wired to the ST-LINK virtual COM port.
# The kernel names it ttySTM0 (the Linux STM32 UART driver).
: "${TARGET_CONSOLE:=ttySTM0}"
: "${CONSOLE_BAUD:=115200}"

# -----------------------------------------------------------------------------
# SD card image layout (see docs/06-sdcard-image.md and docs/images/sd-layout.svg)
#
# A GPT disk. The Boot ROM finds BL2 by partition NAME (fsbl1, then fsbl2);
# BL2 finds the FIP by partition TYPE GUID (or the name "fip"); U-Boot keeps
# its environment in the partition NAMED u-boot-env (the board's U-Boot device
# tree says u-boot,mmc-env-partition = "u-boot-env"), two copies at the end of it.
# Without that partition it would fall back to raw offsets 0x900000 / 0x940000.
#
#   1 MiB  fsbl1        256 KiB   BL2 (tf-a-*.stm32)
#   .25    fsbl2        256 KiB   BL2, second copy (the ROM falls back to it)
#   .5     fip          4 MiB     OP-TEE (3 files) + U-Boot + DTBs
#   9 MiB  u-boot-env   512 KiB   U-Boot environment (two copies, at the end of the partition)
#   16 MiB rootfs       rest      ext4 with /boot/extlinux/extlinux.conf
# -----------------------------------------------------------------------------
: "${FSBL_SIZE_KB:=256}"
: "${FIP_SIZE_KB:=4096}"
: "${ENV_START_MB:=9}"
: "${ENV_SIZE_KB:=512}"
: "${ROOTFS_PART_START_MB:=16}"
: "${ROOTFS_LABEL:=rootfs}"
# GPT partition type GUIDs (see TF-A plat/st/common/include/stm32mp_efi.h)
: "${GUID_ST_FSBL:=8DA63339-0007-60C0-C436-083AC8230908}"
: "${GUID_ST_FIP:=19D5DF83-11B0-457B-BE2C-7559C13142A5}"
: "${GUID_LINUX_FS:=0FC63DAF-8483-4772-8E79-3D69D8477DE4}"
# The root partition is named in the kernel command line by its GPT PARTUUID, so
# it does not matter whether Linux calls the SD card mmcblk0 or mmcblk1.
: "${ROOTFS_PARTUUID:=6d703135-0000-4000-8000-000000000001}"
# Free space (MiB) added on top of the rootfs content. The partition can also
# be grown to the full card when flashing (./build.sh flash --expand).
: "${IMAGE_EXTRA_MB:=512}"
# Kernel command line (see docs/04-kernel.md for what each part does).
# NOTE: no "rootflags=" here on purpose; mount options go in /etc/fstab (docs/09).
: "${KERNEL_CMDLINE_EXTRA:=rootwait rw earlycon}"
