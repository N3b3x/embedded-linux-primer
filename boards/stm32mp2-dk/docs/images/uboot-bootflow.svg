<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-label="U-Boot boot flow: read boot_device and boot_instance from the ROM context, run bootcmd_stm32mp after a one second delay, set boot_targets to the SD card, scan the bootable partition for /boot/extlinux/extlinux.conf with distro boot, then sysboot loads the kernel Image and device tree and booti starts Linux."><rect x="0" y="0" width="1400" height="860" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker><marker id="m-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">How U-Boot finds Linux on this board</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">No boot script is written by hand: ST's default environment runs U-Boot's generic "distro boot", which looks for /boot/extlinux/extlinux.conf.</text><rect x="40" y="120" width="860" height="96" rx="12" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.5"/><rect x="40" y="120" width="56" height="96" rx="12" fill="#2563eb"/><text x="68" y="176" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">1</text><text x="116" y="148" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="15" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">boot_device, boot_instance</text><text x="116" y="168" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">arch/arm/mach-stm32mp/stm32mp2/cpu.c</text><text x="116" y="186" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">U-Boot asks the ROM's boot context where it was loaded from:</text><text x="116" y="202" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">SD card = boot_device mmc; boot_instance says which SDMMC controller.</text><line x1="68" y1="218" x2="68" y2="230" stroke="#e5edf7" stroke-width="3" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="40" y="232" width="860" height="96" rx="12" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.5"/><rect x="40" y="232" width="56" height="96" rx="12" fill="#2563eb"/><text x="68" y="288" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">2</text><text x="116" y="260" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="15" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">bootcmd = run bootcmd_stm32mp</text><text x="116" y="280" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">configs/stm32mp25_defconfig · BOOTDELAY=1</text><text x="116" y="298" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">After a 1 s countdown (any key stops it: prompt "STM32MP&gt; "):</text><text x="116" y="314" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">bootcmd_stm32mp prints "Boot over mmc0!".</text><line x1="68" y1="330" x2="68" y2="342" stroke="#e5edf7" stroke-width="3" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="40" y="344" width="860" height="96" rx="12" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.5"/><rect x="40" y="344" width="56" height="96" rx="12" fill="#2563eb"/><text x="68" y="400" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">3</text><text x="116" y="372" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="15" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">boot_targets = mmc&lt;boot_instance&gt;</text><text x="116" y="392" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">include/configs/stm32mp25_st_common.h</text><text x="116" y="410" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Only the device we booted from is tried.</text><text x="116" y="426" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Then: run distro_bootcmd.</text><line x1="68" y1="442" x2="68" y2="454" stroke="#e5edf7" stroke-width="3" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="40" y="456" width="860" height="96" rx="12" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.5"/><rect x="40" y="456" width="56" height="96" rx="12" fill="#d97706"/><text x="68" y="512" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">4</text><text x="116" y="484" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="15" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">scan_dev_for_boot_part</text><text x="116" y="504" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">include/config_distro_bootcmd.h</text><text x="116" y="522" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">part list mmc N -bootable devplist  → partitions with the bootable flag.</text><text x="116" y="538" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">If there are none, devplist = 1 (partition 1, our BL2: not a filesystem!).</text><line x1="68" y1="554" x2="68" y2="566" stroke="#e5edf7" stroke-width="3" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="40" y="568" width="860" height="96" rx="12" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.5"/><rect x="40" y="568" width="56" height="96" rx="12" fill="#d97706"/><text x="68" y="624" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">5</text><text x="116" y="596" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="15" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">for prefix in "/ /boot/"</text><text x="116" y="616" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">include/config_distro_bootcmd.h</text><text x="116" y="634" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Is there &lt;prefix&gt;extlinux/extlinux.conf?  Yes: run sysboot.</text><text x="116" y="650" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">(No? then boot.scr.uimg / boot.scr is tried; we do not ship one.)</text><line x1="68" y1="666" x2="68" y2="678" stroke="#e5edf7" stroke-width="3" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="40" y="680" width="860" height="96" rx="12" fill="#06231f" stroke="#14b8a6" stroke-width="1.5"/><rect x="40" y="680" width="56" height="96" rx="12" fill="#0d9488"/><text x="68" y="736" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="800" text-anchor="middle" xml:space="preserve" style="fill:#fff;white-space:pre">6</text><text x="116" y="708" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="15" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#5eead4;white-space:pre">sysboot → booti</text><text x="116" y="728" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">cmd/sysboot.c · cmd/booti.c</text><text x="116" y="746" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Reads extlinux.conf: LINUX → kernel_addr_r 0x8A000000, FDT → fdt_addr_r 0x90000000,</text><text x="116" y="762" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">APPEND → bootargs. Then: booti 0x8A000000 - 0x90000000. Linux starts.</text><rect x="930" y="120" width="430" height="192" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="944" y="142" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#64748b;white-space:pre">/boot/extlinux/extlinux.conf</text><text x="944" y="166" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">DEFAULT linux</text><text x="944" y="185" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">TIMEOUT 10</text><text x="944" y="204" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">LABEL linux</text><text x="944" y="223" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#5eead4;white-space:pre">  LINUX /boot/Image</text><text x="944" y="242" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#c4b5fd;white-space:pre">  FDT /boot/stm32mp257f-dk-primer.dtb</text><text x="944" y="261" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">  APPEND root=PARTUUID=6d70326b-0000-4000-</text><text x="944" y="280" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">         8000-000000000001 console=ttySTM0,</text><text x="944" y="299" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">         115200 rootwait rw</text><rect x="930" y="330" width="430" height="230" rx="12" fill="#121c33" stroke="#f59e0b" stroke-width="1.5"/><g transform="translate(946,344) scale(0.916667)" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2" /> <path d="M17 3h2a2 2 0 0 1 2 2v2" /> <path d="M21 17v2a2 2 0 0 1-2 2h-2" /> <path d="M7 21H5a2 2 0 0 1-2-2v-2" /> <circle cx="12" cy="12" r="3" /> <path d="m16 16-1.9-1.9" /></g><text x="978" y="361" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fcd34d;white-space:pre">If it does not boot, read the log</text><text x="946" y="392" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">"Scanning mmc 0:5..."   a partition is being tried</text><text x="946" y="411" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">"Found /boot/extlinux/extlinux.conf"  step 5 worked</text><text x="946" y="430" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">"Retrieving file: /boot/Image"        sysboot is loading</text><text x="946" y="449" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">nothing after "Boot over mmc0!"?  no bootable flag,</text><text x="946" y="468" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">wrong boot_instance, or the rootfs is not ext4.</text><text x="946" y="487" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Stop autoboot and try by hand:</text><rect x="946" y="508" width="398" height="48" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="960" y="530" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">STM32MP&gt; part list mmc 0</text><text x="960" y="546" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">STM32MP&gt; ls mmc 0:5 /boot</text><rect x="930" y="580" width="430" height="206" rx="12" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="946" y="604" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Why the bootable flag matters</text><text x="946" y="628" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">scripts/image.sh sets the GPT attribute LegacyBIOSBootable</text><text x="946" y="647" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">(bit 2) on the rootfs partition only. U-Boot's "part list</text><text x="946" y="666" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">-bootable" reads exactly that bit (disk/part_efi.c). Without</text><text x="946" y="685" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">it U-Boot would scan partition 1 = fsbla1, which holds BL2.</text><text x="32" y="844" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">Everything on this page is stock U-Boot v2026.07: nothing here is specific to this repository except the contents of extlinux.conf and the partition flags.</text></svg>
