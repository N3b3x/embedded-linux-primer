<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="Memory map during boot: in the 256 KiB on-chip SYSRAM, BL31 at 0x0E000000, BL2's device tree at 0x0E011000 and BL2 at 0x0E017000, with the DDR training firmware in SRAM1 above; in DDR, a 64 MiB region at 0x80000000 reserved from the kernel that contains OP-TEE at 0x82000000, U-Boot loaded at 0x84000000 with its device tree at 0x84400000, and U-Boot's load addresses for the kernel and device tree at 0x8A000000 and 0x90000000."><rect x="0" y="0" width="1400" height="760" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#e5edf7;white-space:pre">Where things live in memory during boot</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">Two address ranges matter: 256 KiB of on-chip SYSRAM (BL2 and BL31), and the 4 GiB of LPDDR4 that starts at 0x8000_0000.</text><text x="40" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre" letter-spacing="1">ON-CHIP SYSRAM  0x0E000000 – 0x0E040000  (256 KiB)</text><rect x="40" y="124" width="560" height="560" rx="10" fill="#0a1424" stroke="#26344f" stroke-width="1.2"/><rect x="50" y="134" width="540" height="70" rx="8" fill="#d97706" stroke="#f59e0b" stroke-width="1.4"/><text x="64" y="156" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">SRAM1: DDR PHY firmware</text><text x="576" y="156" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x0E040000 →</text><text x="64" y="176" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">lpddr4_pmu_train.bin is copied here, then loaded into the PHY (STM32MP_DDR_FW_BASE)</text><rect x="50" y="214" width="540" height="150" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1.4"/><text x="64" y="236" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">BL2 image</text><text x="576" y="236" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x0E017000</text><text x="64" y="256" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">this build: 0x0E017000 – 0x0E02CFE8 (90 KB of code and data)</text><text x="64" y="272" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">The ROM copies the .stm32 payload (174,568 bytes) to 0x0E002600 and jumps in</text><rect x="50" y="374" width="540" height="70" rx="8" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.4"/><text x="64" y="396" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">BL2 device tree</text><text x="576" y="396" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x0E011000</text><text x="64" y="416" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">BL2's own DTB (24 KiB reserved): clocks, DDR, which storage</text><rect x="50" y="454" width="540" height="150" rx="8" fill="#e11d48" stroke="#f43f5e" stroke-width="1.4"/><text x="64" y="476" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">BL31 (+ fw-config while BL2 runs)</text><text x="576" y="476" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x0E000000</text><text x="64" y="496" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">92 KiB are left for BL31 below BL2 (STM32MP_BL31_SIZE).</text><text x="64" y="512" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">fw-config is also read to the start of SYSRAM (STM32MP_FW_CONFIG_BASE).</text><text x="64" y="528" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">BL31 stays here for the whole life of the system.</text><text x="54" y="636" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">0x0E000000 = STM32MP_SYSRAM_BASE · size 0x40000 · BL2 region 0x29000 (164 KiB)</text><text x="54" y="658" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">plat/st/stm32mp2/stm32mp2_def.h; addresses of BL2 and its DTB confirmed in the linker map of this build</text><text x="640" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre" letter-spacing="1">DDR  0x80000000 – 0x1_80000000  (4 GiB LPDDR4, drawn NOT to scale)</text><rect x="640" y="124" width="720" height="560" rx="10" fill="#0a1424" stroke="#26344f" stroke-width="1.2"/><rect x="650" y="134" width="700" height="76" rx="8" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.4"/><text x="664" y="156" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">kernel_addr_r…ramdisk_addr_r</text><text x="1336" y="156" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x8A000000 …</text><text x="664" y="176" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">U-Boot's load addresses: Image at 0x8A000000, DTB at 0x90000000 (fdt_addr_r),</text><text x="664" y="192" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">script 0x90100000, extlinux.conf text 0x90200000, overlays 0x90300000, ramdisk 0x90400000</text><rect x="650" y="220" width="700" height="44" rx="8" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="6 4"/><text x="664" y="242" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">free DDR</text><text x="1336" y="242" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#93c5fd;white-space:pre">…</text><text x="664" y="262" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">after booti the kernel runs from here; Linux owns everything not reserved</text><rect x="650" y="274" width="700" height="54" rx="8" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.4"/><text x="664" y="296" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">U-Boot's DTB (hw-config)</text><text x="1336" y="296" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x84400000</text><text x="664" y="316" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">BL2 puts u-boot.dtb here (up to 256 KiB), U-Boot reads it at start</text><rect x="650" y="338" width="700" height="76" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1.4"/><text x="664" y="360" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">U-Boot as loaded (BL33)</text><text x="1336" y="360" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x84000000</text><text x="664" y="380" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">u-boot-nodtb.bin, up to 4 MiB (STM32MP_BL33_MAX_SIZE); U-Boot then relocates itself to</text><text x="664" y="396" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">the top of DDR. 0x84000000 is also kernel_comp_addr_r.</text><rect x="650" y="424" width="700" height="54" rx="8" fill="#e11d48" stroke="#f43f5e" stroke-width="1.4"/><text x="664" y="446" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#fff;white-space:pre">OP-TEE (TZDRAM)</text><text x="1336" y="446" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#fff;white-space:pre">0x82000000</text><text x="664" y="466" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#e2e8f0;white-space:pre">32 MiB (CFG_TZDRAM_START/SIZE = 0x82000000 / 0x02000000): secure, firewalled by RISAF</text><rect x="650" y="488" width="700" height="66" rx="8" fill="#141f35" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="664" y="510" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13" font-weight="800" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">reserved by the kernel DT</text><text x="1336" y="510" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="end" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">0x80000000</text><text x="664" y="530" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">fw@80000000, 64 MiB, no-map: the kernel never touches 0x80000000 – 0x83FFFFFF</text><text x="664" y="546" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">(this covers OP-TEE's 32 MiB)</text><rect x="650" y="570" width="700" height="108" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="664" y="592" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" style="fill:#64748b;white-space:pre">where the numbers come from</text><text x="664" y="616" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#cbd5e1;white-space:pre">DDR_BASE        0x80000000  plat/st/stm32mp2/stm32mp2_def.h</text><text x="664" y="633" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#93c5fd;white-space:pre">BL33_BASE       DDR_BASE + 0x04000000 = 0x84000000   BL33_MAX_SIZE 0x400000</text><text x="664" y="650" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#c4b5fd;white-space:pre">HW_CONFIG_BASE  BL33_BASE + BL33_MAX_SIZE = 0x84400000</text><text x="664" y="667" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#fda4af;white-space:pre">OP-TEE          fdts/stm32mp257f-dk-ca35tdcid-fw-config.dtsi: 0x82000000 / 0x2000000</text><text x="32" y="742" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" style="fill:#9fb0c6;white-space:pre">U-Boot addresses: include/configs/stm32mp25_common.h (__KERNEL_ADDR_R, __FDT_ADDR_R …). Kernel reservation: arch/arm64/boot/dts/st/stm32mp257f-dk.dts.</text></svg>
