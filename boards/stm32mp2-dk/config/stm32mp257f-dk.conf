# shellcheck shell=bash
# =============================================================================
#  Board / BSP configuration for the STMicroelectronics STM32MP257F-DK
#  (STM32MP257F Discovery Kit; see docs/12-board-tour.md)
# =============================================================================
#
#  This file is *sourced* by every script in scripts/. It only sets variables.
#
#  Every value uses the form  : "${VAR:=default}"  which means:
#     "if VAR is already set in the environment, keep it, otherwise use default"
#  So you can override anything for a single run without editing this file:
#
#     KERNEL_VERSION=6.12.57 KERNEL_SHA256=<sum> ./build.sh kernel
#
#  Or keep your overrides in config/local.conf (git-ignored), which build.sh
#  sources *before* this file.
#
#  Unlike the i.MX 8M Plus board in this repository, every source here is
#  UPSTREAM: the projects' own repositories, not a vendor fork. The versions are
#  the latest releases that were current when the board was written (see
#  docs/10-versions.md for how to find and move to newer ones).
#
#  TWO SOFTWARE STACKS, one switch:
#    STACK=mainline   (default) everything upstream, as described above
#    STACK=st         ST's own tested set (ST branches of TF-A, OP-TEE, U-Boot, Linux
#                     6.6 and ST's device trees). Its values live in config/stack-st.conf,
#                     which is read BEFORE this file, so they win; this file stays the
#                     mainline defaults. Choose with  STACK=st ./build.sh all  or
#                     ./build.sh -s st all  or a line STACK=st in config/local.conf.
#                     docs/15-two-stacks.md compares them.
#
#  *_REV variables pin a git commit for reproducible builds. Set one to an empty
#  string (e.g. UBOOT_REV=) to follow the tip of the ref instead.
# =============================================================================

# -----------------------------------------------------------------------------
# Release name, used only in banners/log messages and the image file name
# -----------------------------------------------------------------------------
: "${BSP_RELEASE:=upstream-2026.10}"
: "${BOARD_NAME:=stm32mp257f-dk}"

# -----------------------------------------------------------------------------
# Trusted Firmware-A (TF-A): BL2 (the first thing the Boot ROM runs) and BL31
# (the secure monitor that stays resident)
# -----------------------------------------------------------------------------
: "${TFA_REPO:=https://review.trustedfirmware.org/TF-A/trusted-firmware-a}"
: "${TFA_BRANCH:=v2.15.0}"
: "${TFA_REV:=da738d5eae93af342fdc4995dd3c05acb4c9d757}"
: "${TFA_PLATFORM:=stm32mp2}"
# The device tree TF-A is built for. TF-A has its own small copies of the board
# trees (fdts/), with the clock tree, the DDR settings and the firewall setup.
: "${TFA_DTB:=stm32mp257f-dk.dtb}"
# The DK has one LPDDR4 chip. TF-A compiles exactly one DDR driver; this picks it.
: "${TFA_DDR_TYPE_FLAG:=STM32MP_LPDDR4_TYPE=1}"
# Boot medium compiled into BL2. STM32MP_SDMMC=1: read the FIP from SD/eMMC.
: "${TFA_BOOT_FLAG:=STM32MP_SDMMC=1}"
# Secure-payload dispatcher: opteed = BL31 forwards SMCs to OP-TEE.
: "${TFA_SPD:=opteed}"
# TF-A log level: 10 error, 20 notice (what ST ships), 30 warning, 40 info, 50 verbose.
# FOR A FIRST BOOT use 40: BL2 then prints which partition it booted from ("Boot used
# partition fsbla1"), every image it loads and every error, which is what you want to
# send back if the board stays silent after BL2:
#     echo 'TFA_LOG_LEVEL=40' >> config/local.conf && ./build.sh firmware
# then ./build.sh image and flash again (docs/14-first-boot-checklist.md).
: "${TFA_LOG_LEVEL:=20}"
# Extra make arguments for TF-A, space separated. Empty for the mainline stack.
: "${TFA_EXTRA_FLAGS:=}"

# -----------------------------------------------------------------------------
# DDR PHY training firmware (ST's copy of the Synopsys PMU training code)
# -----------------------------------------------------------------------------
: "${DDRFW_REPO:=https://github.com/STMicroelectronics/stm32-ddr-phy-binary.git}"
: "${DDRFW_BRANCH:=v1.0-stm32mp}"
: "${DDRFW_REV:=77447cf214eadf128e487fcb10a4a78cd4ab6d56}"

# -----------------------------------------------------------------------------
# OP-TEE OS: the trusted OS. On this SoC it is also the SCMI server that owns
# the clocks and resets (see docs/11-secure-world-and-scmi.md)
# -----------------------------------------------------------------------------
: "${OPTEE_REPO:=https://github.com/OP-TEE/optee_os.git}"
: "${OPTEE_BRANCH:=4.11.0}"
: "${OPTEE_REV:=f54190f22611dd5ad5d22546fd4209aa100f56bd}"
: "${OPTEE_PLATFORM:=stm32mp2}"
# OP-TEE gets its own device tree source (the board's secure-world view).
: "${OPTEE_DTS:=stm32mp257f-dk.dts}"

# -----------------------------------------------------------------------------
# Arm SCP-firmware: the reference SCMI server. OP-TEE embeds it, so OP-TEE can
# answer Linux's "enable this clock" requests. Only its source is needed here
# (OP-TEE's build runs CMake on it to generate a module list). The revision is
# the one OP-TEE's own CI builds the stm32mp2 platform against.
# -----------------------------------------------------------------------------
: "${SCPFW_REPO:=https://git.gitlab.arm.com/firmware/SCP-firmware.git}"
: "${SCPFW_BRANCH:=optee-ci-0d480804}"
: "${SCPFW_REV:=0d48080449e3bd3e5218a31c5f24a6068004c5af}"

# -----------------------------------------------------------------------------
# U-Boot (BL33): the normal-world bootloader
# -----------------------------------------------------------------------------
: "${UBOOT_REPO:=https://github.com/u-boot/u-boot.git}"
: "${UBOOT_BRANCH:=v2026.07}"
: "${UBOOT_REV:=ece349ade2973e220f524ce59e59711cc919263f}"
: "${UBOOT_DEFCONFIG:=stm32mp25_defconfig}"
# U-Boot builds its device tree from a copy of the Linux sources ("OF_UPSTREAM",
# dts/upstream/src/arm64/): vendor directory + dts name, without the extension.
: "${UBOOT_DEVICE_TREE:=st/stm32mp257f-dk}"

# -----------------------------------------------------------------------------
# Linux kernel: a stable tarball from kernel.org (about 150 MB, no git history)
# -----------------------------------------------------------------------------
: "${KERNEL_VERSION:=6.18.58}"
: "${KERNEL_URL:=https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz}"
: "${KERNEL_SHA256:=069b19f9032c4dac8149ae4b6520c35debca0f42a9f6d52ee55ba6ca9b818013}"
: "${KERNEL_DEFCONFIG:=defconfig}"
# Appended to `uname -r`, e.g. 6.18.58-custom
: "${KERNEL_LOCALVERSION:=-custom}"
# arm64 kernels are loaded uncompressed by U-Boot's booti: plain "Image".
: "${KERNEL_IMAGE:=Image}"
# Device trees to build and install into /boot (names under arch/arm64/boot/dts/st).
# The FIRST one is the default entry of extlinux.conf; every further one becomes an
# extra boot-menu entry (U-Boot's menu shows for 1 s, press a key on the serial console).
# stm32mp257f-dk-primer.dtb is the stock tree plus a workaround for the SD card supplies
# (custom/dts/stm32mp257f-dk-primer.dts, docs/09-troubleshooting.md). The stock tree is
# the second entry, so a first boot can tell "my workaround is wrong" from "the stock
# tree needs SCMI voltage domains" by choosing the other entry.
: "${KERNEL_DTBS:=st/stm32mp257f-dk-primer.dtb st/stm32mp257f-dk.dtb}"
# Where your own device trees are copied from (see custom/dts/README.md).
: "${CUSTOM_DTS_DIR:=$TOP_DIR/custom/dts}"

# -----------------------------------------------------------------------------
# Cross toolchains (Arm GNU Toolchain). Two are needed:
#   aarch64-none-elf         bare-metal: TF-A BL2/BL31 and OP-TEE core (no libc, no OS)
#   aarch64-none-linux-gnu   Linux user space: the kernel and U-Boot
# The download matches your PC: x86-64 or ARM64 (Apple-silicon Linux VM, Ampere...).
#   arm    -> download the pinned toolchains into build/toolchain
#   system -> use aarch64-linux-gnu-gcc from $PATH for everything
#             (sudo apt install gcc-aarch64-linux-gnu; works, but not reproducible)
# -----------------------------------------------------------------------------
: "${TOOLCHAIN:=arm}"
: "${ARM_TOOLCHAIN_VERSION:=14.3.rel1}"
: "${ARM_TOOLCHAIN_BASE_URL:=https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel}"
: "${ARM_TC_SHA256_x86_64_elf:=ebaf2d47f2e7f7b645864c5c8cf839e526daed83a2e675a3525d03f5ba3d2be9}"
: "${ARM_TC_SHA256_x86_64_linux:=ddeaff1ea60d4135acba271b0143d9f5add02b68ab9e9be39672d1965c12e82f}"
: "${ARM_TC_SHA256_aarch64_elf:=1bbbd25746234c60dd0a00d891b24a6b9848a25ed2b13d95e8d4c19cd78035e3}"
: "${ARM_TC_SHA256_aarch64_linux:=7f4ca1d3b773c41b031019d1249b2c58e6beb470eeabacfa0a0813c5e8bb7e5b}"
# Use ccache automatically when it is installed (makes rebuilds much faster)
: "${USE_CCACHE:=auto}"

# -----------------------------------------------------------------------------
# Root filesystem (see docs/05-rootfs.md)
#   debian           -> build a Debian arm64 rootfs with mmdebstrap
#   alpine           -> download the tiny Alpine minirootfs (no root needed,
#                       handy for a quick bring-up / smoke test)
#   /path/to/rootfs.tar[.gz|.xz|.zst|.bz2]
#                    -> use your own tarball
# -----------------------------------------------------------------------------
: "${ROOTFS:=debian}"
: "${DEBIAN_SUITE:=trixie}"
: "${DEBIAN_MIRROR:=http://deb.debian.org/debian}"
# Debian's archive signing keys. Ubuntu (and older Debian) hosts do not have
# the trixie keys, so the official keyring package is downloaded (checksum
# pinned) and handed to mmdebstrap with --keyring.
: "${DEBIAN_KEYRING_URL:=https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb}"
: "${DEBIAN_KEYRING_SHA256:=9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac}"
: "${DEBIAN_PACKAGES:=systemd-sysv udev dbus kmod iproute2 iputils-ping netbase openssh-server sudo less nano vim-tiny ca-certificates tzdata systemd-timesyncd util-linux-extra e2fsprogs parted fdisk usbutils pciutils i2c-tools can-utils ethtool wget curl htop}"
: "${ALPINE_VERSION:=3.24.2}"
: "${TARGET_HOSTNAME:=stm32mp257f-dk}"
: "${TARGET_USER:=dev}"
# Default password for root and $TARGET_USER. It is a BENCH DEFAULT: change it
# (or set TARGET_PASSWORD in config/local.conf) on anything that leaves your desk.
: "${TARGET_PASSWORD:=stm32mp2}"
# The serial console of the DK: USART2, wired to the ST-LINK virtual COM port.
# The kernel names it ttySTM0 (the Linux STM32 UART driver).
: "${TARGET_CONSOLE:=ttySTM0}"
: "${CONSOLE_BAUD:=115200}"

# -----------------------------------------------------------------------------
# SD card image layout (see docs/06-sdcard-image.md and docs/images/sd-layout.svg)
#
# A GPT disk. The Boot ROM finds BL2 by partition NAME (fsbla1, then fsbla2);
# BL2 finds the FIP by partition TYPE GUID (or the name "fip"); U-Boot keeps
# its environment in the partition NAMED u-boot-env (the board's U-Boot device
# tree says u-boot,mmc-env-partition = "u-boot-env"), two copies at the end of it.
# Without that partition it would fall back to raw offsets 0x900000 / 0x940000.
#
#   1 MiB  fsbla1       256 KiB   BL2 (tf-a-*.stm32)
#   .25    fsbla2       256 KiB   BL2, second copy (the ROM falls back to it)
#   .5     fip          4 MiB     BL31 + OP-TEE + U-Boot + DDR firmware + DTBs
#   9 MiB  u-boot-env   512 KiB   U-Boot environment (two copies, at the end of the partition)
#   16 MiB rootfs       rest      ext4 with /boot/extlinux/extlinux.conf
# -----------------------------------------------------------------------------
: "${FSBL_SIZE_KB:=256}"
: "${FIP_SIZE_KB:=4096}"
: "${ENV_START_MB:=9}"
: "${ENV_SIZE_KB:=512}"
: "${ROOTFS_PART_START_MB:=16}"
: "${ROOTFS_LABEL:=rootfs}"
# GPT partition type GUIDs (see TF-A plat/st/common/include/stm32mp_efi.h)
: "${GUID_ST_FSBL:=8DA63339-0007-60C0-C436-083AC8230908}"
: "${GUID_ST_FIP:=19D5DF83-11B0-457B-BE2C-7559C13142A5}"
: "${GUID_LINUX_FS:=0FC63DAF-8483-4772-8E79-3D69D8477DE4}"
# The root partition is named in the kernel command line by its GPT PARTUUID, so
# it does not matter whether Linux calls the SD card mmcblk0 or mmcblk1.
: "${ROOTFS_PARTUUID:=6d70326b-0000-4000-8000-000000000001}"
# Free space (MiB) added on top of the rootfs content. The partition can also
# be grown to the full card when flashing (./build.sh flash --expand).
: "${IMAGE_EXTRA_MB:=512}"
# Kernel command line (see docs/04-kernel.md for what each part does).
# earlycon prints kernel messages through the firmware's UART before the real serial
# driver is up, so a kernel that dies early still leaves a trace on the console.
# NOTE: no "rootflags=" here on purpose; mount options go in /etc/fstab (docs/09).
: "${KERNEL_CMDLINE_EXTRA:=rootwait rw earlycon}"

# Sector of the first partition: 1 MiB here (the first aligned sector after the GPT). ST's own
# image puts fsbla1 at 17 KiB = sector 34; STACK=st does the same.
: "${FSBL1_START_SECTOR:=2048}"

# The partitions of the image, in table order (names are what the ROM, BL2 and U-Boot
# look for). scripts/flash.sh checks a card against this list before it touches it, and
# grows the one named "rootfs". STACK=st lists eight (config/stack-st.conf).
: "${IMAGE_PARTITIONS:=fsbla1 fsbla2 fip u-boot-env rootfs}"
# Partitions that receive the FIP, and those that receive the FWU metadata (st only).
: "${FIP_PARTITIONS:=fip}"
: "${METADATA_PARTITIONS:=}"

# -----------------------------------------------------------------------------
# Used by STACK=st only: empty for the mainline stack. Their values, and the reasons,
# are in config/stack-st.conf; they are declared here so that no script trips over an
# unset variable.
# -----------------------------------------------------------------------------
: "${EXTDT_REPO:=}"
: "${EXTDT_BRANCH:=}"
: "${EXTDT_REV:=}"
: "${EXTDT_SRC:=$SRC_DIR/dt-stm32mp}"
: "${EXTDT_SUBDIR:=}"
: "${EXTDT_NAME:=}"
: "${OPTEE_EXTRA_FLAGS:=}"
: "${UBOOT_EXTRA_FLAGS:=}"
: "${KERNEL_GIT_REPO:=}"
: "${KERNEL_GIT_REV:=}"
: "${KERNEL_TREE_FRAGMENTS:=}"
: "${KERNEL_FRAGMENT_BASE_URL:=}"
: "${KERNEL_FRAGMENT_SUMS:=}"
: "${META_SIZE_KB:=256}"
: "${FIP_A_PARTUUID:=}"
: "${FIP_B_PARTUUID:=}"
: "${FWU_METADATA_GUID:=}"
