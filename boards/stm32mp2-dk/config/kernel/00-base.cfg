# Default fragment merged on top of the arm64 defconfig (see README.md here).
#
# Keep `uname -r` predictable: "6.18.58-custom" instead of
# "6.18.58-custom-g<git-sha>" (LOCALVERSION_AUTO appends the git hash).
# CONFIG_LOCALVERSION_AUTO is not set

# Keep the open-source Vivante GPU driver out of the kernel. The ST device tree enables a GPU node and
# loading this driver there asks OP-TEE 4.0 for the GPU PLL over SCMI, which crashes OP-TEE (found on
# the bench). The mainline 6.18 device trees have no GPU node, so the driver is inert today; this keeps
# it from waking up if one is added. (docs/09-troubleshooting.md)
# CONFIG_DRM_ETNAVIV is not set
