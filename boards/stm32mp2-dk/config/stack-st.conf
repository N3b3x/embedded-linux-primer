# shellcheck shell=bash
# =============================================================================
#  STACK=st : ST's own software set for the STM32MP257F-DK
# =============================================================================
#
#  Read by scripts/lib/common.sh (load_config) BEFORE stm32mp257f-dk.conf when
#  STACK=st. Every value is  : "${VAR:=default}"  and the first value set wins,
#  so what is written here replaces the mainline default of the same name, while
#  the environment and config/local.conf still override both.
#
#  What this is: the versions and device trees ST ships as "OpenSTLinux r3"
#  (ST's Yocto layer meta-st-stm32mp, tag wrynose_v26.02.18), built here from
#  source WITHOUT Yocto, with the make commands that layer's recipes run. ST's
#  branches of TF-A, OP-TEE, U-Boot and Linux, plus ST's device-tree repository,
#  are the combination a bench-proven configuration booted on this kit (login
#  on the ST-LINK console). docs/15-two-stacks.md compares it with the mainline stack.
#
#  Every commit below was checked against the tag it belongs to
#  (git ls-remote <repo> refs/tags/<tag>^{}).
# =============================================================================

: "${BSP_RELEASE:=st-openstlinux-r3}"

# -----------------------------------------------------------------------------
# ST's external device trees (repo dt-stm32mp). One tree per project: TF-A, OP-TEE,
# U-Boot and Linux each read their own copy, so firmware and kernel agree on which
# peripherals belong to which world, and on the SD card's SCMI regulators.
# -----------------------------------------------------------------------------
: "${EXTDT_REPO:=https://github.com/STMicroelectronics/dt-stm32mp.git}"
: "${EXTDT_BRANCH:=v6-stm32mp}"
# The commit ST's recipe (external-dt_6.0) pins: 2 commits after the tag v6-stm32mp-r3.
: "${EXTDT_REV:=6e8d9fa1a6e76c26cd60262f4208feac3c57975d}"
: "${EXTDT_SRC:=$SRC_DIR/dt-stm32mp}"
# Cortex-A35 is the trusted-domain core (TDCID) in this variant ("ca35tdcid"), "ostl" = OpenSTLinux.
: "${EXTDT_SUBDIR:=stm32mp2/a35-td}"
: "${EXTDT_NAME:=stm32mp257f-dk-ca35tdcid-ostl}"

# -----------------------------------------------------------------------------
# TF-A: ST's branch of the LTS v2.10 line
# -----------------------------------------------------------------------------
: "${TFA_REPO:=https://github.com/STMicroelectronics/arm-trusted-firmware.git}"
: "${TFA_BRANCH:=v2.10-stm32mp-r3}"
: "${TFA_REV:=41575b25c972b6f8958c101458d06ed23e38442b}"
: "${TFA_DTB:=$EXTDT_NAME.dtb}"
# ST ships its images with "debug trace" on (ST_DEBUG_TRACE=1 in its layer): a DEBUG=1
# build with LOG_LEVEL 40 (info). BL2 then prints which partition it booted from, every
# image it loads and every error. That is the build a bench-proven configuration used.
: "${TFA_LOG_LEVEL:=40}"
#   PSA_FWU_SUPPORT=1  BL2 reads the FWU metadata partitions to choose between fip-a and fip-b
#   TFA_EXTERNAL_DT    ST's TF-A device trees (clock tree, DDR settings, RIF firewall setup)
: "${TFA_EXTRA_FLAGS:=ARCH=aarch64 ARM_ARCH_MAJOR=8 DEBUG=1 PSA_FWU_SUPPORT=1 TFA_EXTERNAL_DT=$EXTDT_SRC/$EXTDT_SUBDIR/tf-a}"

# DDR PHY training firmware: the same repository and commit as the mainline stack.

# -----------------------------------------------------------------------------
# OP-TEE: ST's 4.0.0 branch. It carries its own copy of the SCMI server (no scp-firmware
# checkout), including the voltage-domain and regulator protocols that give Linux the
# SD card's supply.
# -----------------------------------------------------------------------------
: "${OPTEE_REPO:=https://github.com/STMicroelectronics/optee_os.git}"
: "${OPTEE_BRANCH:=4.0.0-stm32mp-r3}"
: "${OPTEE_REV:=afdfcb01c02630bd0986342c3b61db60253d8ac9}"
: "${OPTEE_DTS:=$EXTDT_NAME.dts}"
#   NOWERROR=1          do not stop on compiler warnings (a newer compiler than ST's finds some)
#   CFG_STM32MP_PROFILE ST's choice of which services OP-TEE provides: secure_and_system_services
#   CFG_TEE_CORE_DEBUG  ST's "debug trace" build, as for TF-A above
#   CFG_EXT_DTS         ST's OP-TEE device tree (it describes the PMIC and the regulators it serves)
: "${OPTEE_EXTRA_FLAGS:=NOWERROR=1 CFG_STM32MP_PROFILE=secure_and_system_services CFG_TEE_CORE_DEBUG=y CFG_EXT_DTS=$EXTDT_SRC/$EXTDT_SUBDIR/optee}"

# -----------------------------------------------------------------------------
# U-Boot: ST's v2023.10 branch (distro boot reads /boot/extlinux/extlinux.conf, as in the
# mainline stack). On a host with SWIG 4.3 or newer, or Python 3.13 or newer, ST's layer adds two
# host-tool fixes: docs/09-troubleshooting.md says where to get them (patches/st/u-boot/).
# -----------------------------------------------------------------------------
: "${UBOOT_REPO:=https://github.com/STMicroelectronics/u-boot.git}"
: "${UBOOT_BRANCH:=v2023.10-stm32mp-r3}"
: "${UBOOT_REV:=7fbc677b5c104eee309fab7c8bb38eaaf83a45a6}"
: "${UBOOT_DEFCONFIG:=stm32mp25_defconfig}"
: "${UBOOT_DEVICE_TREE:=$EXTDT_NAME}"
: "${UBOOT_EXTRA_FLAGS:=EXT_DTS=$EXTDT_SRC/$EXTDT_SUBDIR/u-boot DEVICE_TREE_EXT=$EXTDT_NAME.dtb}"

# -----------------------------------------------------------------------------
# Linux 6.6: ST's kernel tree (kernel.org 6.6.116 plus ST's patch series), from git.
# ST's Yocto recipe builds the same code from the kernel.org tarball plus a patch; the git
# tag is the same tree in one download.
# -----------------------------------------------------------------------------
: "${KERNEL_VERSION:=6.6-stm32mp-r3}"
: "${KERNEL_GIT_REPO:=https://github.com/STMicroelectronics/linux.git}"
: "${KERNEL_GIT_REV:=80d29586bafa4734bad35a8f063919fdd79f5dec}"
: "${KERNEL_DEFCONFIG:=defconfig}"
# ST configures the arm64 defconfig with four fragments. The first two live in the kernel
# tree; the last two live in ST's Yocto layer and are downloaded (sha256 pinned).
: "${KERNEL_TREE_FRAGMENTS:=arch/arm64/configs/fragment-01-defconfig-cleanup.config arch/arm64/configs/fragment-02-defconfig-addons.config}"
: "${KERNEL_FRAGMENT_BASE_URL:=https://raw.githubusercontent.com/STMicroelectronics/meta-st-stm32mp/a5e5cef8442de4eb3afca97e4c4dddb0f25e4ae1/recipes-kernel/linux/linux-stm32mp/6.6}"
: "${KERNEL_FRAGMENT_SUMS:=fragment-03-systemd.config:3850f32124e0eeff39495243ed07eab60418762e0541fd364a8c33a268b41a47 fragment-04-modules.config:0227d9426735268ac38973973c9425f5e65af1b092dfbbc813e2ed66e6e5302c}"
# The DK's device tree comes from ST's dt-stm32mp repository (KBUILD_EXTDTS), not from the
# kernel tree. There is only this one: it already carries the SCMI regulators, so no
# workaround tree is needed (custom/dts-st/ is for your own additions).
: "${KERNEL_DTBS:=st/$EXTDT_NAME.dtb}"
: "${CUSTOM_DTS_DIR:=$TOP_DIR/custom/dts-st}"
# blacklist etnaviv: the ostl tree enables the GPU node, and loading the open-source GPU
# driver makes it ask OP-TEE 4.0 for the GPU PLL over SCMI, which panics OP-TEE (found on the
# bench). Without ST's GPU packages nothing needs the driver.
: "${KERNEL_CMDLINE_EXTRA:=rootwait rw earlycon modprobe.blacklist=etnaviv}"

# -----------------------------------------------------------------------------
# SD card layout: the one ST's own image uses (docs/06-sdcard-image.md)
#
#   17 KiB fsbla1   BL2        sector 34, right after the GPT; the rest follow back to back
#          fsbla2   BL2 copy
#          metadata1/2  the FWU metadata: "bank 0 = fip-a is active", written twice
#          fip-a    FIP       PARTUUID fixed: the metadata names it
#          fip-b    FIP copy  PARTUUID fixed: the metadata names it
#          u-boot-env
#   16 MiB rootfs
# -----------------------------------------------------------------------------
: "${IMAGE_PARTITIONS:=fsbla1 fsbla2 metadata1 metadata2 fip-a fip-b u-boot-env rootfs}"
: "${FIP_PARTITIONS:=fip-a fip-b}"
: "${METADATA_PARTITIONS:=metadata1 metadata2}"
: "${FSBL1_START_SECTOR:=34}"
# "auto" = right after the previous partition (the mainline stack puts it at a fixed 9 MiB)
: "${ENV_START_MB:=auto}"
: "${META_SIZE_KB:=256}"
: "${FIP_A_PARTUUID:=4fd84c93-54ef-463f-a7ef-ae25ff887087}"
: "${FIP_B_PARTUUID:=09c54952-d5bf-45af-acee-335303766fb3}"
# TF-A's GUID for "FWU metadata" (partition type of the Arm PSA firmware update spec); mkfwumdata
# writes it into the metadata as the location of the images.
: "${FWU_METADATA_GUID:=8a7a84a0-8387-40f6-ab41-a8b9a5a60d23}"
