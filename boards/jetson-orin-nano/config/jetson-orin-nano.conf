# shellcheck shell=bash
# =============================================================================
#  Board / BSP configuration for the NVIDIA Jetson Orin Nano Developer Kit
#  (P3768 carrier + P3767 module) on Jetson Linux R36.4.3 (JetPack 6.2)
# =============================================================================
#
#  This file is *sourced* by every script in scripts/. It only sets variables.
#
#  Every value uses the form  : "${VAR:=default}"  which means:
#     "if VAR is already set in the environment, keep it, otherwise use default"
#  So you can override anything for a single run without editing this file:
#
#     ROOT_DEVICE=sd ./build.sh flash
#
#  Or keep your overrides in config/local.conf (git-ignored), which build.sh
#  sources *before* this file.
#
#  The checksums below were computed from NVIDIA's download servers on
#  2026-10-24 (trust on first use). NVIDIA publishes SHA-1 values for two of
#  the four files in release_sha_hashes.txt; those matched (docs/10-versions.md).
# =============================================================================

# -----------------------------------------------------------------------------
# The release: Jetson Linux R36.4.3 = JetPack 6.2, Linux kernel 5.15.148-tegra
# -----------------------------------------------------------------------------
: "${L4T_RELEASE:=36.4.3}"
: "${L4T_URL_BASE:=https://developer.nvidia.com/downloads/embedded/l4t/r36_release_v4.3}"

# Driver package: flash tools, bootloader binaries, prebuilt kernel, config files.
: "${BSP_FILE:=Jetson_Linux_r${L4T_RELEASE}_aarch64.tbz2}"
: "${BSP_URL:=$L4T_URL_BASE/release/$BSP_FILE}"
: "${BSP_SHA256:=949a44049c4ce6a8efdf572ea0820c874f6ee5d41ca3e4935b9f0e38d11873d2}"

# Sample root filesystem: an Ubuntu 22.04 (jammy) arm64 userland, 1.8 GB.
: "${ROOTFS_FILE:=Tegra_Linux_Sample-Root-Filesystem_r${L4T_RELEASE}_aarch64.tbz2}"
: "${ROOTFS_URL:=$L4T_URL_BASE/release/$ROOTFS_FILE}"
: "${ROOTFS_SHA256:=67b85bae18a532dd2fd75399359ba10829c30c0e60d77231b614df39ab52156d}"

# Public sources: kernel, NVIDIA out-of-tree modules, device trees, ... (226 MB)
: "${SOURCES_FILE:=public_sources.tbz2}"
: "${SOURCES_URL:=$L4T_URL_BASE/sources/$SOURCES_FILE}"
: "${SOURCES_SHA256:=2c177804679e3ed650dabec6fa958388579896f170570c6171a1b6c386669216}"

# -----------------------------------------------------------------------------
# NVIDIA's reference cross compiler (Developer Guide, "Jetson Linux Toolchain"):
# Bootlin aarch64--glibc--stable-2022.08-1, GCC 11.3. It only runs on x86-64.
# -----------------------------------------------------------------------------
: "${TOOLCHAIN_FILE:=aarch64--glibc--stable-2022.08-1.tar.bz2}"
: "${TOOLCHAIN_TOP:=aarch64--glibc--stable-2022.08-1}"
: "${TOOLCHAIN_URL:=https://developer.nvidia.com/downloads/embedded/l4t/r36_release_v3.0/toolchain/$TOOLCHAIN_FILE}"
: "${TOOLCHAIN_SHA256:=8af54f268c462b2d0737df8789b5e35db03a2d1ecbec90e20948f66f9244fcdd}"

# -----------------------------------------------------------------------------
# Which board configuration to flash (a file Linux_for_Tegra/<BOARD>.conf)
#
#   jetson-orin-nano-devkit         the developer kit, standard power modes
#   jetson-orin-nano-devkit-super   same, plus the higher "Super" power budget
#                                   and extra clock steps (JetPack 6.2).
#                                   NVIDIA lists it for every Orin Nano / NX
#                                   module on this carrier, so it is the default
#   (jetson-orin-nano-devkit-nvme and -super-nvme exist as well; they bake the
#    NVMe layout into the board file. This repository uses the documented
#    --external-device route instead, which works for SD, NVMe and USB alike.)
# -----------------------------------------------------------------------------
: "${BOARD:=jetson-orin-nano-devkit-super}"

# -----------------------------------------------------------------------------
# Where the root filesystem lives. The QSPI-NOR chip on the module always holds
# the boot firmware; this choice only decides where the OS goes:
#
#   nvme   an M.2 SSD in the carrier's slot     -> /dev/nvme0n1p1 on the target
#   sd     the microSD card slot                -> /dev/mmcblk0p1 on the target
#   usb    a USB drive on the target            -> /dev/sda1      on the target
#
# NVIDIA's rule of thumb: SD cards and USB drives for this kit must be 64 GB
# or larger (Quick Start, "Assumptions").
# -----------------------------------------------------------------------------
: "${ROOT_DEVICE:=nvme}"

# Partition layouts handed to l4t_initrd_flash.sh (paths inside Linux_for_Tegra):
#   QSPI_LAYOUT : what goes into the 64 MiB boot flash on the module
#   EXT_LAYOUT  : what goes into the SD / NVMe / USB device (the same file is
#                 NVIDIA's documented choice for all three)
: "${QSPI_LAYOUT:=bootloader/generic/cfg/flash_t234_qspi.xml}"
: "${EXT_LAYOUT:=tools/kernel_flash/flash_l4t_t234_nvme.xml}"

# Which boot-order overlay UEFI gets, so it tries ROOT_DEVICE first.
# auto = BootOrderNvme.dtbo | BootOrderSD.dtbo | BootOrderUsb.dtbo,  none = leave
# UEFI's default order, or a file name from Linux_for_Tegra/kernel/dtb.
: "${BOOT_ORDER_OVERLAY:=auto}"

# How the host talks to the board while flashing: "usb0" = Ethernet over the
# same USB-C cable (NVIDIA's documented default, no extra network needed).
: "${FLASH_NETWORK:=usb0}"

# Optional size of the root partition ("APP") written to the device, e.g. 100GiB. Passed as -S.
# Empty = the board file's ROOTFSSIZE, which is 55GiB for the P3767 modules
# (hence NVIDIA's "64 GB or larger" rule for SD cards and USB drives). It must fit
# the device and the partition XML's num_sectors.
: "${APP_SIZE:=}"

# Offline image generation (./build.sh image --offline): the module identity
# the tool would normally read from a board in recovery mode. Values from the
# table at the end of Linux_for_Tegra/tools/kernel_flash/README_initrd_flash.txt
# for "jetson-orin-nano-devkit (Nano 8GB)", module P3767-0005.
: "${OFFLINE_BOARDID:=3767}"
: "${OFFLINE_BOARDSKU:=0005}"
: "${OFFLINE_FAB:=300}"

# lsusb IDs a Jetson Orin Nano shows in Force Recovery Mode (Quick Start):
#   0955:7523  Orin Nano 8GB (P3767-0003 and P3767-0005)
#   0955:7623  Orin Nano 4GB (P3767-0004)
#   0955:7323 / 0955:7423 are the Orin NX modules on the same carrier
: "${RECOVERY_USB_IDS:=0955:7523 0955:7623 0955:7323 0955:7423}"

# -----------------------------------------------------------------------------
# The kernel
# -----------------------------------------------------------------------------
# NVIDIA's Makefile in source/kernel appends "-tegra" (or "-rt-tegra") itself.
: "${KERNEL_LOCALVERSION:=-tegra}"
: "${KERNEL_SRC_DIR:=kernel-jammy-src}"
: "${KERNEL_DEFCONFIG:=defconfig}"

# -----------------------------------------------------------------------------
# Root filesystem personalisation (rootfs step)
#
# tools/l4t_create_default_user.sh creates this account in the rootfs so the
# first boot skips NVIDIA's interactive "oem-config" wizard and you can log in
# straight away. BENCH DEFAULTS: change the password for anything that is not
# a board on your desk.
# -----------------------------------------------------------------------------
: "${TARGET_HOSTNAME:=orin-nano}"
: "${TARGET_USER:=jetson}"
: "${TARGET_PASSWORD:=jetson}"
