<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-label="Flash flow over USB: the Jetson is put in Force Recovery Mode and shows up as an NVIDIA device on the host. The tool sends a bootloader, kernel and initrd to the board's RAM (RCM boot), a USB Ethernet link appears, the host starts the flashing script on the board over SSH, the board mounts the host's flash package over NFS and writes the QSPI-NOR flash and the SD, NVMe or USB drive itself, then reboots."><rect x="0" y="0" width="1400" height="930" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/></marker><marker id="m-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/></marker><marker id="m-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fda4af"/></marker><marker id="m-f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">How the board is flashed: recovery mode, a RAM-booted Linux, NFS over USB</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Nothing is written by the PC directly. The PC boots a small Linux on the Jetson, and that Linux pulls the images and writes the storage.</text><rect x="110" y="100" width="380" height="62" rx="12" fill="#121c33" stroke="#3b82f6" stroke-width="1.6"/><path d="M110,112 a12,12 0 0 1 12,-12 h356 a12,12 0 0 1 12,12 v28 h-380 z" fill="#2563eb"/><g transform="translate(122,109) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2" /> <line x1="8" x2="16" y1="21" y2="21" /> <line x1="12" x2="12" y1="17" y2="21" /></g><text x="154" y="125" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Host PC (x86-64 Ubuntu)</text><text x="478" y="125" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e2e8f0;white-space:pre">sudo l4t_initrd_flash.sh</text><rect x="910" y="100" width="380" height="62" rx="12" fill="#121c33" stroke="#64748b" stroke-width="1.6"/><path d="M910,112 a12,12 0 0 1 12,-12 h356 a12,12 0 0 1 12,12 v28 h-380 z" fill="#475569"/><g transform="translate(922,109) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h4" /> <path d="M10 17h4" /> <path d="M10 7h4" /> <path d="M18 12h2" /> <path d="M18 18h2" /> <path d="M18 6h2" /> <path d="M4 12h2" /> <path d="M4 18h2" /> <path d="M4 6h2" /> <rect x="6" y="2" width="12" height="20" rx="2" /></g><text x="954" y="125" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Jetson Orin Nano Dev Kit</text><text x="1278" y="125" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e2e8f0;white-space:pre">recovery mode</text><line x1="300" y1="166" x2="300" y2="850" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 6"/><line x1="1100" y1="166" x2="1100" y2="850" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/><rect x="320" y="166" width="760" height="20" rx="10" fill="#1b2438" stroke="#334155" stroke-width="1.2"/><g transform="translate(690,167) scale(0.75)" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="1" /> <circle cx="4" cy="20" r="1" /> <path d="M4.7 19.3 19 5" /> <path d="m21 3-3 1 2 2Z" /> <path d="M9.26 7.68 5 12l2 5" /> <path d="m10 14 5 2 3.5-3.5" /> <path d="m18 12 1-1 1 1-1 1Z" /></g><text x="712" y="181" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">one USB-C cable: data only, and it also carries the Ethernet link (usb0)</text><circle cx="700" cy="214" r="11" fill="#fcd34d" stroke="#0b1220" stroke-width="2"/><text x="700" y="218.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">1</text><text x="700" y="198" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="1" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre"></text><text x="722" y="218" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.8" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">Force Recovery Mode: BootROM waits for USB</text><text x="288" y="230" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">lsusb -d 0955:</text><text x="288" y="246" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">→ 0955:7523 NVidia Corp.</text><text x="1114" y="230" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">jumper REC–GND, power on</text><text x="1114" y="246" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">only the BootROM has run</text><line x1="306" y1="330" x2="1090" y2="330" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" marker-end="url(#m-f)"/><circle cx="700" cy="308" r="11" fill="#fcd34d" stroke="#0b1220" stroke-width="2"/><text x="700" y="312.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">2</text><text x="700" y="292" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="1" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre"></text><text x="722" y="312" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.8" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">RCM boot: bootloader + kernel + initrd go into RAM</text><text x="288" y="324" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">flash.sh --no-flash --rcm-boot</text><text x="288" y="340" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">(generated by the tool)</text><text x="1114" y="324" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">MB2 on the CPU complex loads</text><text x="1114" y="340" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">them into SDRAM and starts them</text><line x1="1094" y1="424" x2="310" y2="424" stroke="#5eead4" stroke-width="3" stroke-linecap="round" marker-end="url(#m-t)"/><circle cx="700" cy="402" r="11" fill="#5eead4" stroke="#0b1220" stroke-width="2"/><text x="700" y="406.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">3</text><text x="700" y="386" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="1" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre"></text><text x="722" y="406" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.8" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">a USB Ethernet link appears: usb0 (IPv6)</text><text x="288" y="418" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">host: fc00:1:1:0::1/64</text><text x="288" y="434" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">udev rules installed for the run</text><text x="1114" y="418" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">initrd Linux answers at</text><text x="1114" y="434" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">fe80::1 and fc00:1:1:0::2</text><line x1="306" y1="518" x2="1090" y2="518" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" marker-end="url(#m-b)"/><circle cx="700" cy="496" r="11" fill="#93c5fd" stroke="#0b1220" stroke-width="2"/><text x="700" y="500.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">4</text><text x="700" y="480" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="1" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre"></text><text x="722" y="500" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.8" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">SSH: start the flashing script on the board</text><text x="288" y="512" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">sshpass → root on the initrd</text><text x="288" y="528" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">(account inside the RAM-booted initrd)</text><text x="1114" y="512" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">l4t_flash_from_kernel.sh</text><text x="1114" y="528" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">reads initrd_flash.cfg</text><line x1="1094" y1="612" x2="310" y2="612" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" marker-end="url(#m-b)"/><circle cx="700" cy="590" r="11" fill="#93c5fd" stroke="#0b1220" stroke-width="2"/><text x="700" y="594.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">5</text><text x="700" y="574" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="1" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre"></text><text x="722" y="594" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.8" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">NFS: the board mounts the host's flash package</text><text x="288" y="606" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">exports tools/kernel_flash/</text><text x="288" y="622" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">images over NFS (then removes it)</text><text x="1114" y="606" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">mount of the export;</text><text x="1114" y="622" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">images are read from it</text><rect x="850" y="666" width="500" height="74" rx="12" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.6"/><circle cx="868" cy="682" r="11" fill="#fda4af" stroke="#0b1220" stroke-width="2"/><text x="868" y="686.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">6</text><text x="892" y="684" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.8" font-weight="800" text-anchor="start" style="fill:#fda4af;white-space:pre">the board writes its own storage</text><text x="864" y="704" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.3" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">QSPI-NOR: boot firmware, chain A and B</text><text x="864" y="722" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.3" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">SD / NVMe / USB: GPT, kernel, kernel-dtb, ESP, APP (rootfs)</text><text x="288" y="700" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">waits; the log is saved in</text><text x="288" y="716" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">Linux_for_Tegra/initrdlog/</text><line x1="1094" y1="796" x2="310" y2="796" stroke="#5eead4" stroke-width="3" stroke-linecap="round" marker-end="url(#m-t)"/><circle cx="700" cy="774" r="11" fill="#5eead4" stroke="#0b1220" stroke-width="2"/><text x="700" y="778.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="middle" style="fill:#0b1220;white-space:pre">7</text><text x="700" y="758" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="1" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre"></text><text x="722" y="778" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.8" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">"Success": the board reboots from the new media</text><text x="288" y="790" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="end" style="fill:#9fb0c6;white-space:pre">cleanup: udev rules, NFS export</text><text x="1114" y="790" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">MB1 → … → UEFI → L4TLauncher</text><text x="1114" y="806" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">→ Linux → login (docs/01)</text><rect x="32" y="858" width="1336" height="52" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="48" y="880" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" style="fill:#fcd34d;white-space:pre">Where it usually fails:</text><text x="190" y="880" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">no 0955: device (jumper, cable, port) · step 3 never comes up (IPv6 off, firewall, VPN, a poor-quality cable) · step 5 (NFS blocked by a firewall).</text><text x="48" y="898" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Details and fixes: docs/09-troubleshooting.md and docs/11-recovery-and-usb-flash.md</text></svg>
