<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Comparison of two flashing models. SD-card boards: build the bootloader, kernel and root filesystem, assemble one sdcard.img, write it to a card with dd or bmaptool, insert it and boot. Jetson Orin Nano: build the kernel and root filesystem inside NVIDIA's Linux_for_Tegra tree, generate a flash package, flash it over USB-C in recovery mode from an x86-64 Ubuntu host; the boot firmware lives in the module's QSPI-NOR flash and the SD card, NVMe or USB drive only holds the operating system."><rect x="0" y="0" width="1400" height="900" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker><marker id="m-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/></marker><marker id="m-f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">Two ways to get Linux onto a board: write a card, or flash over USB</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">This repository has both. The SD-card boards build one image file; the Jetson uses NVIDIA's host tools and a recovery mode.</text><rect x="32" y="100" width="656" height="46" rx="12" fill="#121c33" stroke="#14b8a6" stroke-width="1.6"/><path d="M32,112 a12,12 0 0 1 12,-12 h632 a12,12 0 0 1 12,12 v28 h-656 z" fill="#0d9488"/><g transform="translate(44,109) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v-2" /> <path d="M12 18v-2" /> <path d="M16 12v-2" /> <path d="M16 18v-2" /> <path d="M2 11h1.5" /> <path d="M20 18v-2" /> <path d="M20.5 11H22" /> <path d="M4 18v-2" /> <path d="M8 12v-2" /> <path d="M8 18v-2" /> <rect x="2" y="6" width="20" height="10" rx="2" /></g><text x="76" y="125" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">SD-card model</text><text x="676" y="125" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e2e8f0;white-space:pre">i.MX 8M Plus · STM32MP2 in this repository</text><rect x="32" y="160" width="656" height="62" rx="10" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><rect x="32" y="160" width="110" height="62" rx="10" fill="#0d9488"/><text x="87" y="197" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Build</text><text x="158" y="186" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">bootloader + kernel + rootfs</text><text x="158" y="207" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">scripts compile the pieces</text><line x1="87" y1="223" x2="87" y2="233" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-t)"/><rect x="32" y="234" width="656" height="62" rx="10" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><rect x="32" y="234" width="110" height="62" rx="10" fill="#0d9488"/><text x="87" y="271" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Assemble</text><text x="158" y="260" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">ONE file: sdcard.img</text><text x="158" y="281" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">bootloader at a fixed offset, ext4 rootfs</text><line x1="87" y1="297" x2="87" y2="307" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-t)"/><rect x="32" y="308" width="656" height="62" rx="10" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><rect x="32" y="308" width="110" height="62" rx="10" fill="#0d9488"/><text x="87" y="345" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Write</text><text x="158" y="334" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">dd / bmaptool to the card</text><text x="158" y="355" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">any PC, any card reader</text><line x1="87" y1="371" x2="87" y2="381" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-t)"/><rect x="32" y="382" width="656" height="62" rx="10" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><rect x="32" y="382" width="110" height="62" rx="10" fill="#0d9488"/><text x="87" y="419" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Insert</text><text x="158" y="408" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">card into the board, boot switch → SD</text><text x="158" y="429" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">the BootROM reads the card</text><line x1="87" y1="445" x2="87" y2="455" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-t)"/><rect x="32" y="456" width="656" height="62" rx="10" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/><rect x="32" y="456" width="110" height="62" rx="10" fill="#0d9488"/><text x="87" y="493" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Boot</text><text x="158" y="482" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">BootROM → loaders on the card → Linux</text><text x="158" y="503" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">the card holds all boot firmware</text><rect x="712" y="100" width="656" height="46" rx="12" fill="#121c33" stroke="#f59e0b" stroke-width="1.6"/><path d="M712,112 a12,12 0 0 1 12,-12 h632 a12,12 0 0 1 12,12 v28 h-656 z" fill="#d97706"/><g transform="translate(724,109) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="1" /> <circle cx="4" cy="20" r="1" /> <path d="M4.7 19.3 19 5" /> <path d="m21 3-3 1 2 2Z" /> <path d="M9.26 7.68 5 12l2 5" /> <path d="m10 14 5 2 3.5-3.5" /> <path d="m18 12 1-1 1 1-1 1Z" /></g><text x="756" y="125" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">Vendor-flash model</text><text x="1356" y="125" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="end" style="fill:#e2e8f0;white-space:pre">NVIDIA Jetson Orin Nano (this board)</text><rect x="712" y="160" width="656" height="62" rx="10" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.3"/><rect x="712" y="160" width="110" height="62" rx="10" fill="#d97706"/><text x="767" y="197" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Build</text><text x="838" y="186" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">kernel (optional) + rootfs in Linux_for_Tegra/</text><text x="838" y="207" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">NVIDIA ships the boot firmware as binaries</text><line x1="767" y1="223" x2="767" y2="233" stroke="#fcd34d" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-f)"/><rect x="712" y="234" width="656" height="62" rx="10" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.3"/><rect x="712" y="234" width="110" height="62" rx="10" fill="#d97706"/><text x="767" y="271" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Assemble</text><text x="838" y="260" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">a flash PACKAGE: signed images + initrd</text><text x="838" y="281" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">generated by l4t_initrd_flash.sh --no-flash</text><line x1="767" y1="297" x2="767" y2="307" stroke="#fcd34d" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-f)"/><rect x="712" y="308" width="656" height="62" rx="10" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.3"/><rect x="712" y="308" width="110" height="62" rx="10" fill="#d97706"/><text x="767" y="345" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Write</text><text x="838" y="334" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">over USB-C, board in recovery mode</text><text x="838" y="355" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">x86-64 Ubuntu host with NVIDIA's tools</text><line x1="767" y1="371" x2="767" y2="381" stroke="#fcd34d" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-f)"/><rect x="712" y="382" width="656" height="62" rx="10" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.3"/><rect x="712" y="382" width="110" height="62" rx="10" fill="#d97706"/><text x="767" y="419" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Insert</text><text x="838" y="408" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">SD / NVMe / USB drive is just the root device</text><text x="838" y="429" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">flashed by the board itself, through NFS</text><line x1="767" y1="445" x2="767" y2="455" stroke="#fcd34d" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m-f)"/><rect x="712" y="456" width="656" height="62" rx="10" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.3"/><rect x="712" y="456" width="110" height="62" rx="10" fill="#d97706"/><text x="767" y="493" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Boot</text><text x="838" y="482" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.4" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">BootROM → QSPI-NOR firmware → UEFI → Linux</text><text x="838" y="503" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.8" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">the module holds all boot firmware</text><text x="32" y="548" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="15" font-weight="800" text-anchor="start" style="fill:#e5edf7;white-space:pre">What changes for you</text><rect x="330" y="566" width="442" height="30" rx="7" fill="#0d9488"/><text x="342" y="586" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="start" style="fill:#fff;white-space:pre">SD-card boards</text><rect x="780" y="566" width="588" height="30" rx="7" fill="#d97706"/><text x="792" y="586" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="start" style="fill:#fff;white-space:pre">Jetson Orin Nano</text><rect x="32" y="602" width="290" height="44" rx="7" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="44" y="629" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="700" text-anchor="start" style="fill:#cbd5e1;white-space:pre">First-stage firmware lives…</text><rect x="330" y="602" width="442" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="342" y="629" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">on the SD card (or eMMC)</text><rect x="780" y="602" width="588" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="792" y="629" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">in the module's 64 MiB QSPI-NOR flash, never on the root device</text><rect x="32" y="652" width="290" height="44" rx="7" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="44" y="679" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="700" text-anchor="start" style="fill:#cbd5e1;white-space:pre">A bricked OS is fixed by…</text><rect x="330" y="652" width="442" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="342" y="679" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">re-writing the card in any PC</text><rect x="780" y="652" width="588" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="792" y="679" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">recovery mode + USB: the tool rewrites firmware and OS</text><rect x="32" y="702" width="290" height="44" rx="7" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="44" y="729" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="700" text-anchor="start" style="fill:#cbd5e1;white-space:pre">Changing the boot firmware…</text><rect x="330" y="702" width="442" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="342" y="729" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">rebuild U-Boot / TF-A from source, re-write the image</text><rect x="780" y="702" width="588" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="792" y="729" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">flash a new package; UEFI source (NVIDIA/edk2-nvidia) is public, MB1/MB2 are binary</text><rect x="32" y="752" width="290" height="44" rx="7" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="44" y="779" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="700" text-anchor="start" style="fill:#cbd5e1;white-space:pre">Your PC must be…</text><rect x="330" y="752" width="442" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="342" y="779" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">any Linux, x86-64 or ARM64</text><rect x="780" y="752" width="588" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="792" y="779" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">x86-64 Ubuntu (NVIDIA names 20.04 and 22.04)</text><rect x="32" y="802" width="290" height="44" rx="7" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="44" y="829" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="700" text-anchor="start" style="fill:#cbd5e1;white-space:pre">The 'image' you ship is…</text><rect x="330" y="802" width="442" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="342" y="829" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">one file (+ .bmap)</text><rect x="780" y="802" width="588" height="44" rx="7" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="792" y="829" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">a Linux_for_Tegra tree and its generated flash package (several GB)</text><text x="32" y="880" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Neither model is better: the SD-card flow shows every byte; the Jetson flow trades that for fail-safe A/B boot firmware and a recovery path that does not need the OS.</text></svg>
