<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-label="Files that decide how the Jetson Orin Nano boots, in boot order: the MB1 binary, its boot configuration table and the QSPI partition XML; the board specification files and the flash scripts; MB2, UEFI and L4TLauncher; the secure OS; the kernel Makefile, defconfig and NVIDIA's out-of-tree modules; the device tree sources of the Orin Nano Super developer kit; and the scripts that assemble the user space."><rect x="0" y="0" width="1400" height="1190" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">The files to open, in boot order</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Paths are inside build/work/Linux_for_Tegra/ after ./build.sh fetch rootfs kernel. 'binary' means NVIDIA ships it compiled; there is nothing to read.</text><rect x="32" y="100" width="1336" height="138" rx="14" fill="#141f35" stroke="#64748b" stroke-width="1.6"/><rect x="32" y="100" width="190" height="138" rx="14" fill="#475569"/><text x="127" y="167" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="15" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">BootROM · MB1</text><text x="127" y="187" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">NVIDIA binary + config</text><rect x="240" y="107" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="127" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">bootloader/mb1_t234_prod.bin</text><text x="876" y="127" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">MB1 itself: binary, signed and encrypted by NVIDIA</text><rect x="240" y="143" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="163" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">bootloader/generic/BCT/tegra234-mb1-bct-pinmux-p3767-dp-a03.dtsi</text><text x="876" y="163" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">MB1-BCT: pinmux for the module. Open it: it is a device tree source</text><rect x="240" y="179" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="199" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">bootloader/generic/cfg/flash_t234_qspi.xml</text><text x="876" y="199" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">which firmware image goes into which QSPI-NOR partition, and how large</text><line x1="127" y1="239" x2="127" y2="252" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="32" y="254" width="1336" height="138" rx="14" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.6"/><rect x="32" y="254" width="190" height="138" rx="14" fill="#2563eb"/><text x="127" y="321" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Board specification</text><text x="127" y="341" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">what flash.sh reads</text><rect x="240" y="261" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="281" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">jetson-orin-nano-devkit-super.conf</text><text x="876" y="281" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">the board: picks the device tree (DTB_FILE), BPMP dtb, pinmux, layouts</text><rect x="240" y="297" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="317" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">p3767.conf.common</text><text x="876" y="317" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">settings shared by every P3767 module (Orin Nano / NX)</text><rect x="240" y="333" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="353" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">flash.sh · tools/kernel_flash/l4t_initrd_flash.sh</text><text x="876" y="353" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">the drivers: partition XML + .conf → signed images → flash</text><line x1="127" y1="393" x2="127" y2="406" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="32" y="408" width="1336" height="138" rx="14" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.6"/><rect x="32" y="408" width="190" height="138" rx="14" fill="#2563eb"/><text x="127" y="475" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="13.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">MB2 · UEFI · L4TLauncher</text><text x="127" y="495" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">NVIDIA binary</text><rect x="240" y="415" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="435" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">bootloader/mb2_t234.bin · bootloader/uefi_jetson.bin</text><text x="876" y="435" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">MB2 and UEFI as shipped; UEFI source: github.com/NVIDIA/edk2-nvidia</text><rect x="240" y="451" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="471" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">kernel/dtb/L4TConfiguration.dtbo · BootOrder*.dtbo</text><text x="876" y="471" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">UEFI settings as device-tree overlays: boot mode, boot device order</text><rect x="240" y="487" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="507" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">bootloader/BOOTAA64.efi · bootloader/extlinux.conf</text><text x="876" y="507" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">L4TLauncher, and the extlinux.conf copied to &lt;rootfs&gt;/boot/extlinux/</text><line x1="127" y1="547" x2="127" y2="560" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="32" y="562" width="1336" height="102" rx="14" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.6"/><rect x="32" y="562" width="190" height="102" rx="14" fill="#e11d48"/><text x="127" y="611" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="15" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Secure OS</text><text x="127" y="631" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">public source</text><rect x="240" y="569" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="589" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#fda4af;white-space:pre">bootloader/tos-optee_t234.img</text><text x="876" y="589" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">the OP-TEE secure OS image (bootloader/SOURCE.tos-optee_t234.img names its sources: atf, nv-optee)</text><rect x="240" y="605" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="625" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#fda4af;white-space:pre">source/atf_src.tbz2 · source/nvidia-jetson-optee-source.tbz2</text><text x="876" y="625" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">their sources: arm-trusted-firmware/ and optee/optee_os/</text><line x1="127" y1="665" x2="127" y2="678" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="32" y="680" width="1336" height="138" rx="14" fill="#06231f" stroke="#14b8a6" stroke-width="1.6"/><rect x="32" y="680" width="190" height="138" rx="14" fill="#0d9488"/><text x="127" y="747" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="15" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Linux kernel</text><text x="127" y="767" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">built by ./build.sh kernel</text><rect x="240" y="687" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="707" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">source/kernel/Makefile</text><text x="876" y="707" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">NVIDIA's own build recipe: defconfig, Image, dtbs, modules; we unroll it</text><rect x="240" y="723" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="743" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">source/kernel/kernel-jammy-src/arch/arm64/configs/defconfig</text><text x="876" y="743" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">the kernel configuration (Linux 5.15.148, '-tegra' local version)</text><rect x="240" y="759" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="779" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">source/Makefile · nvidia-oot/ · nvgpu/ · nvdisplay/ · hwpm/</text><text x="876" y="779" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">the out-of-tree modules: GPU, display, camera, hardware performance</text><line x1="127" y1="819" x2="127" y2="832" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="32" y="834" width="1336" height="174" rx="14" fill="#1d1640" stroke="#8b5cf6" stroke-width="1.6"/><rect x="32" y="834" width="190" height="174" rx="14" fill="#7c3aed"/><text x="127" y="919" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="15" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Device tree</text><text x="127" y="939" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">built by make dtbs</text><rect x="240" y="841" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="861" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="9.4" font-weight="400" text-anchor="start" style="fill:#c4b5fd;white-space:pre">source/hardware/nvidia/t23x/nv-public/nv-platform/tegra234-p3768-0000+p3767-0005-nv-super.dts</text><text x="876" y="861" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">the Orin Nano Super devkit: includes the -nv.dts and trims the CPU OPP table</text><rect x="240" y="877" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="897" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#c4b5fd;white-space:pre">…/nv-platform/tegra234-p3768-0000+p3767-xxxx-nv-common.dtsi</text><text x="876" y="897" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">nodes shared by every module on this carrier: aliases, I2S, DMIC, thermal, camera</text><rect x="240" y="913" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="933" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#c4b5fd;white-space:pre">…/nv-platform/tegra234-p3768-0000.dtsi · tegra234-p3767-0000.dtsi</text><text x="876" y="933" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">the carrier (P3768) and the module (P3767) layers</text><rect x="240" y="949" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="969" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#c4b5fd;white-space:pre">source/kernel-devicetree/generic-dts/Makefile</text><text x="876" y="969" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">how the .dts files become kernel/dtb/*.dtb</text><line x1="127" y1="1009" x2="127" y2="1022" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="32" y="1024" width="1336" height="102" rx="14" fill="#1d1640" stroke="#8b5cf6" stroke-width="1.6"/><rect x="32" y="1024" width="190" height="102" rx="14" fill="#7c3aed"/><text x="127" y="1073" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="15" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">User space</text><text x="127" y="1093" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">assembled by ./build.sh rootfs</text><rect x="240" y="1031" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="1051" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#c4b5fd;white-space:pre">apply_binaries.sh · nv_tegra/nv-apply-debs.sh</text><text x="876" y="1051" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">installs NVIDIA's Debian packages and tarballs into rootfs/</text><rect x="240" y="1067" width="620" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="252" y="1087" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#c4b5fd;white-space:pre">tools/l4t_create_default_user.sh · tools/l4t_update_initrd.sh</text><text x="876" y="1087" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.6" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">the login account, and the initrd that must match the modules</text><text x="32" y="1150" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Handy: grep -rn "p3767" build/work/Linux_for_Tegra/*.conf · grep -rn "MAXN_SUPER" build/work/Linux_for_Tegra/source/hardware/ · dtc -I dtb -O dts kernel/dtb/L4TConfiguration.dtbo</text><text x="32" y="1170" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Each file is explained, with what to change and where, in docs/15-source-tour.md.</text></svg>
