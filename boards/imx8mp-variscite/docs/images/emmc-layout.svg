<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="Layout of the Variscite on-module eMMC for this repository. The SD card layout is shown for comparison: imx-boot.bin at 32 KiB, U-Boot's saved environment at 7 MiB, and the ext4 root partition from 8 MiB. The eMMC has three hardware areas. The boot partitions boot0 and boot1 hold imx-boot.bin starting at byte 0. The user area holds the partition table, a copy of imx-boot.bin at 32 KiB that is unused while a boot partition is enabled, the U-Boot environment at 7 MiB and the root partition from 8 MiB. The RPMB partition is not used. The EXT_CSD PARTITION_CONFIG field, set with mmc partconf, selects boot0, boot1 or the user area for the Boot ROM."><rect x="0" y="0" width="1400" height="800" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/></marker><marker id="m-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">What is where in the on-module eMMC</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Three hardware areas. The ROM reads the container from the one that EXT_CSD names; the user area holds the partition table and the root filesystem.</text><text x="32" y="136" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#e5edf7;white-space:pre">SD card</text><text x="32" y="156" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">what ./build.sh flash writes</text><text x="32" y="178" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">/dev/mmcblk1</text><text x="32" y="196" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">mmc 1</text><rect x="250" y="112" width="1110" height="70" rx="10" fill="#121c33" stroke="#64748b" stroke-width="1.6"/><rect x="258" y="122" width="40" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="1.4"/><text x="278" y="145" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">MBR</text><rect x="306" y="122" width="190" height="50" rx="6" fill="#d97706" stroke="#f59e0b" stroke-width="1.4"/><text x="401" y="145" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">imx-boot.bin</text><text x="401" y="162" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">ROM reads it here</text><rect x="504" y="122" width="70" height="50" rx="6" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="6 4"/><text x="539" y="145" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fda4af;white-space:pre">env</text><rect x="582" y="122" width="762" height="50" rx="6" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.4"/><text x="963" y="145" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">p1 · ext4 "root"</text><text x="963" y="162" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">/boot (Image.gz, dtbs) and the OS</text><text x="306" y="192" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">32 KiB</text><text x="504" y="192" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">7 MiB</text><text x="582" y="192" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">8 MiB</text><text x="258" y="192" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">0</text><text x="32" y="236" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="start" style="fill:#93c5fd;white-space:pre" letter-spacing="1.2">ON-MODULE eMMC  (uSDHC3, /dev/mmcblk2, U-Boot mmc 2)</text><line x1="32" y1="246" x2="1368" y2="246" stroke="#26344f" stroke-width="1.2" stroke-dasharray="4 5"/><text x="32" y="286" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#e5edf7;white-space:pre">boot0</text><text x="32" y="306" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">hardware boot partition 1, 4 MiB</text><text x="32" y="328" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">/dev/mmcblk2boot0</text><text x="32" y="346" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">mmc dev 2 1</text><rect x="250" y="262" width="1110" height="78" rx="10" fill="#121c33" stroke="#3b82f6" stroke-width="1.6"/><rect x="258" y="272" width="250" height="58" rx="6" fill="#d97706" stroke="#f59e0b" stroke-width="1.4"/><text x="383" y="299" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">imx-boot.bin</text><text x="383" y="316" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">starts at byte 0</text><rect x="516" y="272" width="828" height="58" rx="6" fill="#141f35" stroke="#64748b" stroke-width="1.4"/><text x="930" y="299" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#cbd5e1;white-space:pre">free</text><text x="258" y="356" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">0 (not 32 KiB)</text><text x="32" y="396" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#e5edf7;white-space:pre">boot1</text><text x="32" y="416" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">hardware boot partition 2, 4 MiB</text><text x="32" y="438" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">/dev/mmcblk2boot1</text><text x="32" y="456" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">mmc dev 2 2</text><rect x="250" y="372" width="1110" height="78" rx="10" fill="#121c33" stroke="#3b82f6" stroke-width="1.6"/><rect x="258" y="382" width="250" height="58" rx="6" fill="#d97706" stroke="#f59e0b" stroke-width="1.4"/><text x="383" y="409" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">imx-boot.bin</text><text x="383" y="426" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">second copy, starts at byte 0</text><rect x="516" y="382" width="828" height="58" rx="6" fill="#141f35" stroke="#64748b" stroke-width="1.4"/><text x="930" y="409" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#cbd5e1;white-space:pre">free</text><text x="32" y="506" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#e5edf7;white-space:pre">user area</text><text x="32" y="526" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">all the rest, 29 GiB here</text><text x="32" y="548" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">/dev/mmcblk2</text><text x="32" y="566" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">mmc dev 2 0</text><rect x="250" y="482" width="1110" height="78" rx="10" fill="#121c33" stroke="#8b5cf6" stroke-width="1.6"/><rect x="258" y="492" width="40" height="58" rx="6" fill="#475569" stroke="#64748b" stroke-width="1.4"/><text x="278" y="519" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">MBR</text><rect x="306" y="492" width="190" height="58" rx="6" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="401" y="519" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fcd34d;white-space:pre">imx-boot.bin</text><text x="401" y="536" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#fcd34d;white-space:pre">copy, unused while boot0 is on</text><rect x="504" y="492" width="70" height="58" rx="6" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="6 4"/><text x="539" y="519" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fda4af;white-space:pre">env</text><text x="539" y="536" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#fda4af;white-space:pre">1 MiB</text><rect x="582" y="492" width="762" height="58" rx="6" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.4"/><text x="963" y="519" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">p1 · ext4 "root"  →  /dev/mmcblk2p1</text><text x="963" y="536" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">grow it to the whole eMMC on the board (docs/16)</text><text x="306" y="576" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">32 KiB</text><text x="504" y="576" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">7 MiB</text><text x="582" y="576" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">8 MiB</text><text x="258" y="576" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">0</text><rect x="32" y="598" width="218" height="50" rx="12" fill="none" stroke="none" stroke-width="1.2"/><text x="32" y="618" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#e5edf7;white-space:pre">rpmb</text><text x="32" y="638" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">replay-protected, 4 MiB</text><rect x="250" y="602" width="1110" height="40" rx="10" fill="#0f192d" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/><text x="266" y="628" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">/dev/mmcblk2rpmb · not used by this build (secure storage with OP-TEE, docs/13)</text><rect x="32" y="668" width="1336" height="112" rx="14" fill="#050a14" stroke="#334155" stroke-width="1.4"/><g transform="translate(50,684) scale(1)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17H5" /> <path d="M19 7h-9" /> <circle cx="17" cy="17" r="3" /> <circle cx="7" cy="7" r="3" /></g><text x="86" y="702" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#e5edf7;white-space:pre">Which area does the ROM read?  EXT_CSD[179] PARTITION_CONFIG, written by  mmc partconf 2 1 1 0</text><text x="86" y="726" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">BOOT_PARTITION_ENABLE = 1  →  boot0        = 2  →  boot1        = 7  →  user area        = 0  →  not enabled (the ROM boots the user area at 32 KiB)</text><text x="86" y="748" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">BOOT_ACK = 1: the eMMC sends the boot acknowledge.     PARTITION_ACCESS = 0: afterwards, reads and writes go to the user area.</text><text x="86" y="768" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">Read it on the board:  mmc extcsd read /dev/mmcblk2 | grep PARTITION_CONFIG     ·     in U-Boot:  mmc partconf 2</text></svg>
